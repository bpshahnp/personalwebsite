<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.py hub</title>

    <!-- Matching site fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Prism.js Syntax Highlighter Theme CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <!-- Pyodide Python Interpreter -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../index.html" class="home-link">← B. Prasad Shah</a>
            <h1>.py hub</h1>
            <!-- Search Bar Added Here -->
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search snippets (e.g. list, binary)..." aria-label="Search snippets">
            </div>
            <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Global Loading Banner for Pyodide -->
    <div id="pyodide-loader" class="loader-banner">
        Downloading Python Environment (this may take a moment)...
    </div>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <h3>Categories</h3>
            <ul id="category-list">
                <!-- Categories will be injected here automatically by script.js -->
            </ul>
        </aside>

        <main class="content">
            <h2 id="current-category">All Snippets</h2>
            <div id="snippet-container"></div>
        </main>
    </div>

    <div class="overlay" id="overlay"></div>

    <!-- Prism.js Core & Python Grammar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
