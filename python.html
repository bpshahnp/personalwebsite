<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Hub | B. Prasad Shah</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Pyodide: runs Python in the browser, main thread, loaded on first Run -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <!-- Prism tokenises the code; the token colours live in css/style.css so the
       editor matches this site's navy instead of a borrowed theme. -->
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">B. <span>Prasad Shah</span></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="mcq.html">MCQ Hub</a>
        <a href="python.html" class="active">Python Hub</a>
        <a href="leaderboard.html">Leaderboard</a>
      </nav>
      <div class="header-actions">
        <div class="auth-widget">
          <button class="auth-icon-btn" id="authIconBtn" aria-label="Account"></button>
          <div class="auth-dropdown" id="authDropdown" hidden></div>
        </div>
      </div>
      <div class="mobile-header-icons">
        <button class="nav-toggle" id="navToggle" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="auth-widget">
          <button class="auth-icon-btn" id="authIconBtnMobile" aria-label="Account"></button>
          <div class="auth-dropdown" id="authDropdownMobile" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <div class="nav-drawer" id="navDrawer">
    <button class="drawer-close" id="drawerClose" aria-label="Close menu">&times;</button>
    <nav class="drawer-nav">
      <a href="index.html">Home</a>
      <a href="mcq.html">MCQ Hub</a>
      <a href="python.html" class="active">Python Hub</a>
      <a href="leaderboard.html">Leaderboard</a>
    </nav>
  </div>
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <div class="pyhub-bar">
    <div class="container pyhub-bar-inner">
      <h1>Python Hub</h1>
      <button class="rail-toggle" id="railToggle" aria-controls="programRail" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"></circle></svg>
        Programs
      </button>
    </div>
  </div>

  <div class="container pyhub-layout">
    <aside class="pyhub-rail" id="programRail" aria-label="Program list">
      <div class="rail-head">
        <label class="rail-search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="15.5" y1="15.5" x2="21" y2="21"></line></svg>
          <input type="search" id="search-input" placeholder="Search programs" aria-label="Search programs" autocomplete="off" spellcheck="false">
        </label>
        <p class="rail-count" id="rail-count" aria-live="polite">Loading…</p>
      </div>
      <div class="rail-list" id="rail-list"></div>
    </aside>

    <main class="pyhub-workspace" id="workspace">
      <p class="workspace-note">Loading programs…</p>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> B. Prasad Shah — Python Hub</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-widget.js"></script>
  <script src="js/nav-drawer.js"></script>
  <script src="js/python-hub.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
