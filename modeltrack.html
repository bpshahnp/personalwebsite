<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Revival Tracker</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#1a1a1e; --muted:#6b7280;
    --accent:#6d5efc; --accent2:#00c2a8; --danger:#ef4444; --border:#e5e7eb;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111114; --card:#1c1c22; --text:#f2f2f5; --muted:#9ca3af; --border:#2c2c34;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111114; --card:#1c1c22; --text:#f2f2f5; --muted:#9ca3af; --border:#2c2c34;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  p.sub{color:var(--muted);margin:0 0 20px;font-size:0.9rem;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
  label{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:4px;}
  input[type=text], input[type=datetime-local]{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:0.95rem;margin-bottom:12px;
  }
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  button{
    cursor:pointer;border:none;border-radius:10px;padding:10px 14px;font-size:0.9rem;font-weight:600;
  }
  .btn-now{background:var(--border);color:var(--text);flex:0 0 auto;}
  .btn-add{background:var(--accent);color:#fff;width:100%;padding:12px;margin-top:4px;}
  .btn-del{background:transparent;color:var(--danger);padding:4px 8px;font-size:0.8rem;}
  .model{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px;margin-bottom:12px;overflow-x:auto;
  }
  .model-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .model-name{font-weight:700;font-size:1.05rem;}
  .dates{color:var(--muted);font-size:0.78rem;margin-top:4px;line-height:1.5;}
  .countdown{
    margin-top:10px;font-size:1.3rem;font-weight:700;letter-spacing:0.5px;
    color:var(--accent2);
  }
  .revived{color:var(--accent2);}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:0.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔁 Model Revival Tracker</h1>
  <p class="sub">Revival date = expiry date + 7 days. Add a model below to start the countdown.</p>

  <div class="card">
    <label for="name">Model name</label>
    <input type="text" id="name" placeholder="e.g. Claude Fable 5" />

    <label for="expiry">Expiry date & time</label>
    <div class="row">
      <input type="datetime-local" id="expiry" />
      <button class="btn-now" id="nowBtn">Now</button>
    </div>

    <button class="btn-add" id="addBtn">Add model</button>
  </div>

  <div id="list"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = "model_revival_entries";
  const WEEK_MS = 7*24*60*60*1000;

  function loadEntries(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveEntries(entries){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    catch(e){ console.error("Could not save:", e); }
  }

  let entries = loadEntries();

  const nameEl = document.getElementById('name');
  const expiryEl = document.getElementById('expiry');
  const listEl = document.getElementById('list');

  function toLocalInputValue(date){
    const pad = n => String(n).padStart(2,'0');
    return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+'T'+pad(date.getHours())+':'+pad(date.getMinutes());
  }

  document.getElementById('nowBtn').addEventListener('click', ()=>{
    expiryEl.value = toLocalInputValue(new Date());
  });

  document.getElementById('addBtn').addEventListener('click', ()=>{
    const name = nameEl.value.trim();
    const expiryVal = expiryEl.value;
    if(!name || !expiryVal){
      alert('Please enter a model name and expiry date.');
      return;
    }
    const expiryMs = new Date(expiryVal).getTime();
    entries.push({ id: Date.now(), name, expiryMs });
    saveEntries(entries);
    nameEl.value = '';
    expiryEl.value = '';
    render();
  });

  function removeEntry(id){
    entries = entries.filter(e => e.id !== id);
    saveEntries(entries);
    render();
  }

  function formatDate(ms){
    return new Date(ms).toLocaleString(undefined, {
      year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
    });
  }

  function formatCountdown(diffMs){
    if(diffMs <= 0) return null;
    const s = Math.floor(diffMs/1000);
    const days = Math.floor(s/86400);
    const hours = Math.floor((s%86400)/3600);
    const mins = Math.floor((s%3600)/60);
    const secs = s%60;
    return days+"d "+String(hours).padStart(2,'0')+"h "+String(mins).padStart(2,'0')+"m "+String(secs).padStart(2,'0')+"s";
  }

  function render(){
    if(entries.length === 0){
      listEl.innerHTML = '<div class="empty">No models tracked yet. Add one above.</div>';
      return;
    }
    listEl.innerHTML = entries.map(e => {
      const revivalMs = e.expiryMs + WEEK_MS;
      return `<div class="model" data-id="${e.id}" data-revival="${revivalMs}">
        <div class="model-top">
          <div class="model-name">${escapeHtml(e.name)}</div>
          <button class="btn-del" data-del="${e.id}">Remove</button>
        </div>
        <div class="dates">
          Expiry: ${formatDate(e.expiryMs)}<br>
          Revival: ${formatDate(revivalMs)}
        </div>
        <div class="countdown" data-countdown></div>
      </div>`;
    }).join('');

    listEl.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=> removeEntry(Number(btn.dataset.del)));
    });
    tick();
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function tick(){
    listEl.querySelectorAll('.model').forEach(card=>{
      const revivalMs = Number(card.dataset.revival);
      const cd = card.querySelector('[data-countdown]');
      const diff = revivalMs - Date.now();
      const formatted = formatCountdown(diff);
      if(formatted){
        cd.textContent = "⏳ " + formatted + " until revival";
        cd.classList.remove('revived');
      } else {
        cd.textContent = "✅ Revived!";
        cd.classList.add('revived');
      }
    });
  }

  render();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
