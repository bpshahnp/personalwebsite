<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Installment Schedule Generator</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1b2733;--muted:#5d6b7a;--line:#d9e2ec;--head:#0b6e99;--headtext:#fff;--band:#e3f3fb;--accent:#0b6e99;--inputbg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b232c;--text:#e6edf3;--muted:#93a1b0;--line:#2d3945;--head:#0b6e99;--headtext:#fff;--band:#1f3340;--accent:#4cb8e6;--inputbg:#12171d}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b232c;--text:#e6edf3;--muted:#93a1b0;--line:#2d3945;--head:#0b6e99;--headtext:#fff;--band:#1f3340;--accent:#4cb8e6;--inputbg:#12171d}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:10px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--inputbg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--band);border-radius:10px;padding:10px}
.stat small{display:block;color:var(--muted);font-size:.75rem}
.stat b{font-size:1.05rem}
.err{color:#d64545;font-size:.9rem;margin:8px 0 0;min-height:1.1em}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:.9rem;cursor:pointer}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
th{background:var(--head);color:var(--headtext);text-align:right;padding:8px 10px;font-size:.85rem;position:sticky;top:0}
td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:center}
tbody tr:nth-child(odd){background:var(--band)}
tfoot td{font-weight:700;border-top:2px solid var(--head)}
</style>
</head>
<body>
<main>
<h1>Installment Schedule Generator</h1>
<div class="card">
  <div class="grid">
    <div><label for="total">Total Amount</label><input id="total" type="number" inputmode="decimal" min="0" value="500000"></div>
    <div><label for="inst">Principal per installment</label><input id="inst" type="number" inputmode="decimal" min="0" value="10000"></div>
    <div><label for="rate">Interest rate (% per year)</label><input id="rate" type="number" inputmode="decimal" min="0" step="0.01" value="12"></div>
  </div>
  <div class="err" id="err"></div>
</div>

<div class="card stats" id="stats"></div>

<div class="card">
  <div class="bar"><strong>Schedule</strong><button id="copy" type="button">Copy for Excel</button></div>
  <div class="wrap">
    <table>
      <thead><tr><th>#</th><th>Total Amount</th><th>Interest Rate</th><th>Interest</th><th>(-) Principal</th><th>Payment</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot id="foot"></tfoot>
    </table>
  </div>
</div>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var fmt=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
  var data=[];
  function r2(x){return Math.round(x*100)/100}
  function calc(){
    var total=parseFloat($('total').value),inst=parseFloat($('inst').value),rate=parseFloat($('rate').value);
    $('err').textContent='';data=[];
    if(!(total>0)||!(inst>0)||!(rate>=0)){
      $('err').textContent='Enter a positive total amount and installment, and a non-negative rate.';
      render(rate);return;
    }
    if(Math.ceil(total/inst)>1200){$('err').textContent='That would be over 1,200 installments. Increase the installment amount.';render(rate);return}
    var bal=total;
    while(bal>0.004){
      var interest=r2(bal*rate/100/12);
      var principal=Math.min(inst,bal);
      data.push({n:data.length+1,bal:bal,interest:interest,principal:principal,pay:r2(interest+principal)});
      bal=r2(bal-principal);
    }
    render(rate);
  }
  function render(rate){
    var rows=$('rows'),html='',ti=0,tp=0;
    data.forEach(function(d){
      ti+=d.interest;tp+=d.principal;
      html+='<tr><td>'+d.n+'</td><td>'+fmt.format(d.bal)+'</td><td>'+fmt.format(rate)+'%</td><td>'+fmt.format(d.interest)+'</td><td>'+fmt.format(d.principal)+'</td><td>'+fmt.format(d.pay)+'</td></tr>';
    });
    rows.innerHTML=html;
    ti=r2(ti);tp=r2(tp);
    $('foot').innerHTML=data.length?'<tr><td></td><td></td><td>Total</td><td>'+fmt.format(ti)+'</td><td>'+fmt.format(tp)+'</td><td>'+fmt.format(r2(ti+tp))+'</td></tr>':'';
    $('stats').innerHTML=data.length?
      '<div class="stat"><small>Installments</small><b>'+data.length+'</b></div>'+
      '<div class="stat"><small>Total interest</small><b>'+fmt.format(ti)+'</b></div>'+
      '<div class="stat"><small>Total paid</small><b>'+fmt.format(r2(ti+tp))+'</b></div>'+
      '<div class="stat"><small>First payment</small><b>'+fmt.format(data[0].pay)+'</b></div>'+
      '<div class="stat"><small>Last payment</small><b>'+fmt.format(data[data.length-1].pay)+'</b></div>':'';
  }
  $('copy').addEventListener('click',function(){
    if(!data.length)return;
    var rate=$('rate').value;
    var t='Total Amount\tInterest Rate\tInterest\t(-) Principal\n'+data.map(function(d){return [d.bal,rate+'%',d.interest,d.principal].join('\t')}).join('\n');
    var btn=this;
    function done(m){btn.textContent=m;setTimeout(function(){btn.textContent='Copy for Excel'},1500)}
    try{navigator.clipboard.writeText(t).then(function(){done('Copied!')},function(){fallback()})}catch(e){fallback()}
    function fallback(){
      try{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done('Copied!')}catch(e){done('Copy failed')}
    }
  });
  ['total','inst','rate'].forEach(function(id){$(id).addEventListener('input',calc)});
  calc();
})();
</script>
</body>
</html>
