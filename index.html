<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B. Prasad Shah</title>
<meta name="description" content="B. Prasad Shah">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAFAF8;
    --ink: #171A1C;
    --muted: #7B8083;
    --accent: #1F5C4E;
    --accent-soft: #E7EEEC;
    --brass: #A97B32;
    --line: #E3E1D9;
    --display: 'Fraunces', serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:64px 20px;
  }

  .contour-bg{
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:0;
    opacity:0.5;
    pointer-events:none;
  }
  .contour-bg path{
    fill:none;
    stroke:var(--accent);
    stroke-width:1;
    opacity:0.3;
  }
  .contour-bg path:nth-child(odd){ opacity:0.16; }

  .mark{
    position:relative;
    z-index:1;
    text-align:center;
    width:100%;
    max-width:480px;
  }
  .mark .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    display:inline-block;
    margin-bottom:20px;
  }
  .mark h1{
    font-family:var(--display);
    font-weight:500;
    font-size:clamp(32px, 6vw, 56px);
    letter-spacing:-0.01em;
    line-height:1.05;
  }
  .mark .sub{
    margin-top:14px;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---- Projects list ---- */
  .projects{
    margin-top:48px;
    text-align:left;
    border-top:1px solid var(--line);
  }
  .project{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:20px 4px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:inherit;
    transition:background .2s ease, padding-left .2s ease;
  }
  .project:hover{
    background:var(--accent-soft);
    padding-left:12px;
  }
  .project-info{ min-width:0; }
  .project-name{
    font-family:var(--display);
    font-weight:500;
    font-size:19px;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .project-desc{
    margin-top:5px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.01em;
    line-height:1.5;
  }
  .project-arrow{
    flex:0 0 auto;
    font-size:14px;
    color:var(--accent);
    transition:transform .2s ease, color .2s ease;
  }
  .project:hover .project-arrow{
    color:var(--brass);
    transform:translateX(3px);
  }

  .footer-note{
    margin-top:32px;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

  <svg class="contour-bg" viewBox="0 0 1080 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M -50 620 Q 200 580 400 630 T 900 600 T 1150 640" />
    <path d="M -50 560 Q 220 510 420 570 T 920 530 T 1150 580" />
    <path d="M -50 500 Q 240 440 440 510 T 940 460 T 1150 510" />
    <path d="M -50 440 Q 260 370 460 450 T 960 390 T 1150 440" />
    <path d="M -50 380 Q 280 300 480 390 T 980 320 T 1150 370" />
    <path d="M -50 320 Q 300 230 500 330 T 1000 250 T 1150 300" />
    <path d="M -50 260 Q 320 160 520 270 T 1020 180 T 1150 230" />
  </svg>

  <div class="mark">
    <span class="dot"></span>
    <h1>B. Prasad Shah</h1>
    <div class="sub">Kathmandu, Nepal</div>

    <nav class="projects">
      <a class="project" href="pyhub/index.html">
        <div class="project-info">
          <div class="project-name">.py hub</div>
          <div class="project-desc">Python scripts, notes and small tools.</div>
        </div>
        <span class="project-arrow">→</span>
      </a>

      <a class="project" href="mcqhub/index.html">
        <div class="project-info">
          <div class="project-name">Quiz hub</div>
          <div class="project-desc">Multiple-choice quizzes with live scoring.</div>
        </div>
        <span class="project-arrow">→</span>
      </a>
    </nav>

    <div class="footer-note">Updated 2026</div>
  </div>

</body>
</html>
