<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B. Prasad Shah</title>
<meta name="description" content="B. Prasad Shah">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAFAF8;
    --ink: #171A1C;
    --muted: #7B8083;
    --accent: #1F5C4E;
    --brass: #A97B32;
    --display: 'Fraunces', serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  .contour-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index:0;
    opacity:0.5;
  }
  .contour-bg path{
    fill:none;
    stroke:var(--accent);
    stroke-width:1;
    opacity:0.3;
  }
  .contour-bg path:nth-child(odd){ opacity:0.16; }

  .mark{
    position:relative;
    z-index:1;
    text-align:center;
  }
  .mark .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    display:inline-block;
    margin-bottom:20px;
  }
  .mark h1{
    font-family:var(--display);
    font-weight:500;
    font-size:clamp(32px, 6vw, 56px);
    letter-spacing:-0.01em;
    line-height:1.05;
  }
  .mark .sub{
    margin-top:14px;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

  <svg class="contour-bg" viewBox="0 0 1080 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M -50 620 Q 200 580 400 630 T 900 600 T 1150 640" />
    <path d="M -50 560 Q 220 510 420 570 T 920 530 T 1150 580" />
    <path d="M -50 500 Q 240 440 440 510 T 940 460 T 1150 510" />
    <path d="M -50 440 Q 260 370 460 450 T 960 390 T 1150 440" />
    <path d="M -50 380 Q 280 300 480 390 T 980 320 T 1150 370" />
    <path d="M -50 320 Q 300 230 500 330 T 1000 250 T 1150 300" />
    <path d="M -50 260 Q 320 160 520 270 T 1020 180 T 1150 230" />
  </svg>

  <div class="mark">
    <span class="dot"></span>
    <h1>B. Prasad Shah</h1>
    <div class="sub">Kathmandu, Nepal</div>
  </div>

</body>
</html>
