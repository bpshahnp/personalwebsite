const DATA=[{"g":"2021 September (Make up)","o":0,"s":"The financing decision of a firm is concerned with acquiring fixed asset.","a":false,"e":"Financing decision is primarily concerned with determining the appropriate amount and mix of the different sources of capital required to finance the firm's assets."},{"g":"2021 September (Make up)","o":1,"s":"Turnover ratios provide the measure for how effectively the firm's assets are being utilized.","a":true,"e":"Turnover ratios measure the productivity of asset utilization in terms of generating sales with a given amount of investment in assets."},{"g":"2021 September (Make up)","o":2,"s":"If we deposit Rs. 2,000 today at an annual interest rate of 10 percent, it is compounded to Rs. 2,662 at the end of year 3.","a":true,"e":"FV₃ = PV(1 + i)³ = Rs 2,000 × (1.10)³ = Rs 2,662."},{"g":"2021 September (Make up)","o":3,"s":"The risk-free rate is 8 percent, the expected market return is 14%. If stock's beta is 1.5, required rate of return on the stock should be 17 percent.","a":true,"e":"By CAPM: E(Rᵢ) = R_F + [E(R_M) − R_F]βᵢ = 8% + (14% − 8%)(1.5) = 17%."},{"g":"2021 September (Make up)","o":4,"s":"Value of a premium bond increases as remaining time to maturity decreases.","a":false,"e":"A premium bond sells above face value, and its value keeps declining as it approaches maturity (it converges to par). So the value decreases, not increases.","n":"The book marks this True, but its own explanation says the value declines, so the correct answer is False."},{"g":"2021 September (Make up)","o":5,"s":"Valuation of a common stock is more complex than the valuation of bonds.","a":true,"e":"Common stock pays no fixed dividend and its valuation is based on investors' expectations about future cash flows."},{"g":"2021 September (Make up)","o":6,"s":"NPV method considers entire streams of cash flows.","a":true,"e":"Net present value is the difference between the present value of all future cash flows and the present value of the cost."},{"g":"2021 September (Make up)","o":7,"s":"A firm purchases 10,000 units annually. Its ordering cost is Rs 100 per order and carrying cost is Rs 2 per unit. Firm's EOQ should be 1,000 units.","a":true,"e":"EOQ = √(2RO/C) = √(2 × 10,000 × 100 / 2) = √1,000,000 = 1,000 units."},{"g":"2021 September (Make up)","o":8,"s":"Net working capital can be defined as the difference between total assets and current liabilities.","a":false,"e":"Net working capital is the difference between current assets and current liabilities, not total assets and current liabilities."},{"g":"2021 September (Make up)","o":9,"s":"Higher cash conversion cycle is desirable.","a":false,"e":"A higher cash conversion cycle leads to higher working capital financing requirements for the company."},{"g":"2020 (Make up) Jan–Feb","o":1000,"s":"Profit maximization objective considers time value of the benefits.","a":false,"e":"Under profit maximization, identical amounts of benefits derived over several periods are treated equally irrespective of timing."},{"g":"2020 (Make up) Jan–Feb","o":1001,"s":"Income statement of a firm shows financial position of the firm.","a":false,"e":"The income statement summarizes revenue generated and expenses incurred over an accounting period. It shows profit and loss, not financial position (that's the balance sheet)."},{"g":"2020 (Make up) Jan–Feb","o":1002,"s":"Higher turnover ratio is always preferred.","a":true,"e":"A higher turnover ratio indicates better utilization of assets, i.e. better productive power in generating sales with a given investment in assets."},{"g":"2020 (Make up) Jan–Feb","o":1003,"s":"If we deposit Rs. 2,000 today at an annual interest rate of 10 percent, it is compounded to Rs. 2,662 at the end of year 3.","a":true,"e":"FV₃ = Rs 2,000 (1.10)³ = Rs 2,662."},{"g":"2020 (Make up) Jan–Feb","o":1004,"s":"There is inverse relationship between discount rate and present value.","a":true,"e":"At a higher discount rate the present value of future cash flows from an asset is lower, and vice versa."},{"g":"2020 (Make up) Jan–Feb","o":1005,"s":"Standard deviation measures total risk in relative term.","a":false,"e":"Standard deviation is a stand-alone, absolute measure of total risk. It does not consider the level of return (coefficient of variation is the relative measure)."},{"g":"2020 (Make up) Jan–Feb","o":1006,"s":"An investor purchased a share of stock at Rs. 300 and sold for Rs. 400 at the end of the year. The investor received dividend Rs. 50 per share during the year. Investor's rate of return is 40 percent.","a":false,"e":"R = (P₁ − P₀ + D₁)/P₀ = (400 − 300 + 50)/300 = 0.5 or 50%, not 40%."},{"g":"2020 (Make up) Jan–Feb","o":1007,"s":"Higher cash conversion cycle is desirable.","a":false,"e":"A higher cash conversion cycle leads to higher working capital financing requirements."},{"g":"2020 (Make up) Jan–Feb","o":1008,"s":"Cash budget is usually prepared at the end of accounting year.","a":false,"e":"Cash budget is used for short-term cash planning and is usually prepared for monthly periods."},{"g":"2020 (Make up) Jan–Feb","o":1009,"s":"A firm's current asset and fixed assets are Rs. 800,000 and Rs. 1,400,000 respectively. If the firm's current liabilities is Rs. 600,000 amount of net working capital will be Rs. 200,000.","a":true,"e":"Net WC = Current assets − Current liabilities = Rs 800,000 − Rs 600,000 = Rs 200,000."},{"g":"2019 April","o":2000,"s":"The board of directors is responsible for managing day-to-day operations and carrying out the policies established by the chief executive officer.","a":false,"e":"The board is not responsible for day-to-day operations. Policies are established by the board of directors and executed by the CEO."},{"g":"2019 April","o":2001,"s":"Net cash flow differs from firm's net income because of depreciation and other non-cash expenses and income.","a":true,"e":"Net cash flow is net income plus depreciation and other non-cash expenses and income."},{"g":"2019 April","o":2002,"s":"Management attempts to increase total assets turnover.","a":true,"e":"Total assets turnover measures the efficiency or productivity of assets, so management tries to increase it."},{"g":"2019 April","o":2003,"s":"The constant growth dividend model does not hold true when growth rate is greater or equal to investor's required rate.","a":true,"e":"In Gordon's model, stock price cannot be negative or infinite, so the model fails when growth rate ≥ required rate (P₀ = D₁/(k − g))."},{"g":"2019 April","o":2004,"s":"An investor purchased a share of stock at Rs 500 and sold for Rs 530 at the end of the year. The investor received dividend Rs 20 per share during the year. Investor's rate of return is 50 percent.","a":false,"e":"HPR = (P₁ − P₀ + D)/P₀ = (530 − 500 + 20)/500 = 10%, not 50%."},{"g":"2019 April","o":2005,"s":"Stock beta is calculated to measure total risk associated with the security.","a":false,"e":"Beta measures systematic (market) risk, not total risk. β = Cov(i,m)/σₘ² or r·σⱼ/σₘ."},{"g":"2019 April","o":2006,"s":"Value of premium bond decreases gradually as it approaches to maturity.","a":true,"e":"A premium bond's value gradually decreases toward par as maturity approaches, and a discount bond's value gradually increases."},{"g":"2019 April","o":2007,"s":"Bank A offers 12 percent interest and applies quarterly compounding and Bank B offers 13 percent interest but it applies annual compounding. If you want to deposit money for one year, you should choose Bank A.","a":false,"e":"Effective rate of Bank A = (1 + 0.12/4)⁴ − 1 = 12.55%. Effective rate of Bank B = 13%. Bank B gives the higher return, so you should choose Bank B.","n":"The book marks this True, but its own calculation (12.55% vs 13%) favours Bank B, so the correct answer is False."},{"g":"2019 April","o":2008,"s":"Higher day's sales outstanding (DSO) is desirable.","a":false,"e":"Lower DSO is desirable, because higher DSO shows credit collection is slow and there is a chance of bad debt."},{"g":"2019 April","o":2009,"s":"A firm's current asset and fixed assets are Rs 300,000 and Rs 500,000 respectively. If firm's current liabilities is Rs 250,000 amount of net working capital will be Rs 50,000.","a":true,"e":"Net working capital = Rs 300,000 − Rs 250,000 = Rs 50,000."},{"g":"2019 January (Make up)","o":3000,"s":"Profit maximization objective ignores timing of cash flow streams.","a":true,"e":"Profit maximization is concerned only with profit and ignores the timing of cash flow streams."},{"g":"2019 January (Make up)","o":3001,"s":"Higher current ratio is preferred as it indicates strong liquidity position of the firm.","a":true,"e":"A higher current ratio indicates a strong liquidity position."},{"g":"2019 January (Make up)","o":3002,"s":"The risk-free rate and expected market return are 8 percent and 14 respectively. If Star Company's stock has a beta of 1.5 required rate of return should be 17 percent.","a":true,"e":"CAPM: Rⱼ = R_f + (R_m − R_f)βⱼ = 8 + (14 − 8)(1.5) = 17%."},{"g":"2019 January (Make up)","o":3003,"s":"When required rate of return is greater than the coupon rate, the bond will sell at premium.","a":false,"e":"If required rate of return (YTM) is greater than the coupon rate, the bond sells at a discount, not premium."},{"g":"2019 January (Make up)","o":3004,"s":"Preferred stock is hybrid security.","a":true,"e":"It has features of both common stock and bonds."},{"g":"2019 January (Make up)","o":3005,"s":"Initial investment outlay is the total project cost. It includes price of the machine, shipment charges, installation cost but does not include investment in working capital.","a":false,"e":"Initial investment outlay does include investment in working capital, along with machine price, shipment and installation costs."},{"g":"2019 January (Make up)","o":3006,"s":"Net cash flow differs from net income.","a":true,"e":"Net cash flow adds back depreciation and other non-cash expenses, while net income does not."},{"g":"2019 January (Make up)","o":3007,"s":"Depreciation and amortization are not shown in cash budget.","a":true,"e":"A cash budget is a schedule of cash receipts and payments during the plan period; non-cash items like depreciation are excluded."},{"g":"2019 January (Make up)","o":3008,"s":"Coefficient of variation measures systematic risk in relative terms.","a":false,"e":"Coefficient of variation measures risk per unit of return (total risk in relative terms), not systematic risk."},{"g":"2019 January (Make up)","o":3009,"s":"Net working capital can be defined as the difference between total assets and current liabilities.","a":false,"e":"It is the difference between current assets and current liabilities."},{"g":"TU 2018","o":4000,"s":"The investment decision of a firm is concerned with deciding on which financing sources are to be used to finance an asset.","a":false,"e":"Investment decision is about which assets should be purchased, not which financing sources to use."},{"g":"TU 2018","o":4001,"s":"Preferred stockholders have prior claim to debtholders.","a":false,"e":"Debtholders have prior claim over preferred stockholders."},{"g":"TU 2018","o":4002,"s":"If we deposit Rs 1,000 today at an annual interest rate of 10 percent, it is compounded to Rs 1,331 at the end of year 3.","a":true,"e":"FV = 1,000 (1 + 0.10)³ = Rs 1,331."},{"g":"TU 2018","o":4003,"s":"The risk-free rate and expected market return are 6 percent and 12 respectively. If Star Company's stock has a beta of 1.5, required rate of return should be 15 percent.","a":true,"e":"K = R_f + (R_m − R_f)β = 6% + (12 − 6)% × 1.5 = 15%."},{"g":"TU 2018","o":4004,"s":"When required rate of return is greater than the coupon rate, the bond will sell at premium.","a":false,"e":"If required rate (K) is greater than coupon rate (I), the bond sells at a discount, not premium."},{"g":"TU 2018","o":4005,"s":"Standard deviation is used to compare systematic risk associated with the securities.","a":false,"e":"Standard deviation compares total risk, not systematic risk only."},{"g":"TU 2018","o":4006,"s":"Increase in the working capital is considered as cash inflow at the beginning.","a":false,"e":"An increase in working capital is a cash outflow at the beginning."},{"g":"TU 2018","o":4007,"s":"Net cash flow differs from net income.","a":true,"e":"Net cash flow is net income plus depreciation and other non-cash expenses and income."},{"g":"TU 2018","o":4008,"s":"Effective annual rate is always higher than nominal rate when compounding period is less than a year.","a":true,"e":"More frequent compounding adds interest on interest, so EAR exceeds the nominal rate."},{"g":"TU 2018","o":4009,"s":"Higher day's sales is outstanding desirable.","a":false,"e":"Lower DSO is desirable, because higher DSO shows slow credit collection and a chance of bad debt."},{"g":"2018 (Make up)","o":5000,"s":"The financing decision of a firm is concerned with deciding on which assets should be purchased.","a":false,"e":"That is the investment decision. Financing decision is concerned with fund raising."},{"g":"2018 (Make up)","o":5001,"s":"Net cash flow differs from firm's net income because of depreciation and other noncash expenses and income.","a":true,"e":"Net cash flow is net income plus depreciation and other non-cash expenses and income."},{"g":"2018 (Make up)","o":5002,"s":"Higher assets turnover is desirable.","a":true,"e":"Total assets turnover measures the efficiency or productivity of assets, so management attempts to increase it."},{"g":"2018 (Make up)","o":5003,"s":"The constant growth dividend model does not hold true when growth rate is greater or equal to investors' required rate.","a":true,"e":"Gordon's model would give a negative or infinite stock price when g ≥ k, so it is not valid."},{"g":"2018 (Make up)","o":5004,"s":"An investor purchased a share of stock at Rs 200 and sold for Rs 240 at the end of the year. The investor received dividend Rs 20 per share during the year. Investor's rate of return is 60 percent.","a":false,"e":"HPR = (240 − 200 + 20)/200 = 30%, not 60%."},{"g":"2018 (Make up)","o":5005,"s":"If market rate is higher than coupon rate, bond sells at premium.","a":false,"e":"If market rate (K) is higher than coupon rate (I), the bond sells at a discount, not premium."},{"g":"2018 (Make up)","o":5006,"s":"Value of Rs 1,000 par, 10-year, zero coupon bond, at 10 percent required rate should be Rs 500.","a":false,"e":"V₀ = M/(1 + k)ⁿ = 1,000/(1.10)¹⁰ = Rs 385.54, not Rs 500."},{"g":"2018 (Make up)","o":5007,"s":"If City bank offers 12 percent interest and applies quarterly compounding, the effective interest rate of City bank is 12.55 percent.","a":true,"e":"Effective rate = (1 + 0.12/4)⁴ − 1 = 12.55%.","n":"The book marks this False and quotes 16.99%, but its own calculation gives 12.55%, so the statement is True."},{"g":"2018 (Make up)","o":5008,"s":"Higher day's sales outstanding (DSO) is desirable.","a":false,"e":"Lower DSO is desirable, because higher DSO shows slow credit collection and a chance of bad debt."},{"g":"2018 (Make up)","o":5009,"s":"A firm's current asset and fixed assets are Rs 400,000 and Rs 600,000 respectively. If firm's current liabilities is Rs 250,000 amount of net working capital will be Rs 150,000.","a":true,"e":"Net working capital = Rs 400,000 − Rs 250,000 = Rs 150,000."},{"g":"TU 2017","o":6000,"s":"Wealth maximization goal is superior to profit maximization.","a":true,"e":"Wealth maximization considers timing of returns, risk, social responsibility, business ethics, etc."},{"g":"TU 2017","o":6001,"s":"Present value of Rs 1,000 due in four year, at 10 percent discount rate is Rs 683.","a":true,"e":"PV = FV/(1 + k)ⁿ = 1,000/(1.10)⁴ = Rs 683."},{"g":"TU 2017","o":6002,"s":"If the equity multiplier is 2.0, the debt ratio must be 0.4.","a":false,"e":"EM = 1/(1 − DR) → 2 = 1/(1 − DR) → 2 − 2DR = 1 → DR = 0.50, not 0.40."},{"g":"TU 2017","o":6003,"s":"Value of short-term bond changes more than the value of long-term bond for a given change in discount rate.","a":false,"e":"Long-term bonds are more sensitive (greater interest rate risk), so a short-term bond's value changes less."},{"g":"TU 2017","o":6004,"s":"Return on equity (ROE) is the product of net profit margin and total asset turnover.","a":false,"e":"ROE is the product of profit margin, total assets turnover and equity multiplier (DuPont)."},{"g":"TU 2017","o":6005,"s":"Value of Rs 100, 12 percent preferred stock at 10 percent required rate will be Rs 83.33.","a":false,"e":"P₀ = DPS/k = Rs 12/0.10 = Rs 120, so Rs 83.33 is wrong.","n":"The book's working shows Rs 100, but Rs 12 ÷ 0.10 = Rs 120. Either way, Rs 83.33 is incorrect, so the answer is False."},{"g":"TU 2017","o":6006,"s":"When IRR equals to cost of capital, NPV equals to zero.","a":true,"e":"If IRR equals cost of capital, return equals cost, so NPV is zero."},{"g":"TU 2017","o":6007,"s":"Higher day's sales outstanding (DSO) is desirable.","a":false,"e":"Lower DSO is desirable, because higher DSO shows slow credit collection and a chance of bad debt."},{"g":"TU 2017","o":6008,"s":"If we combine positively correlated assets, we can eliminate the significant portion of risk.","a":false,"e":"Combining positively correlated assets cannot eliminate a significant portion of risk."},{"g":"TU 2017","o":6009,"s":"A firm's current asset and fixed assets are Rs 100,000 and Rs 200,000 respectively. If firm's current liabilities is Rs 70,000 amount of net working capital will be Rs 30,000.","a":true,"e":"NWC = Rs 100,000 − Rs 70,000 = Rs 30,000."},{"g":"TU 2016","o":7000,"s":"The investment decision of a firm is concerned with deciding on which financing sources are to be used to finance an investment.","a":false,"e":"Investment decision is about which assets to buy; financing sources are a financing decision."},{"g":"TU 2016","o":7001,"s":"Net cash flow differs from firm's net income because of depreciation and other non-cash expenses and income.","a":true,"e":"Net cash flow is net income plus depreciation and other non-cash expenses and income."},{"g":"TU 2016","o":7002,"s":"There is an inverse relationship between the value of a bond and its required rate of return.","a":true,"e":"When the required rate rises, bond value falls, and vice versa."},{"g":"TU 2016","o":7003,"s":"The constant growth dividend model does not hold true when growth rate is greater or equal to investor's required rate.","a":true,"e":"Gordon's model would give a negative or infinite price when g ≥ k."},{"g":"TU 2016","o":7004,"s":"If we combine perfectly negatively correlated assets, we can eliminate the risk using minimum variance weight.","a":true,"e":"Combining perfectly negatively correlated assets with minimum-variance weights can eliminate risk."},{"g":"TU 2016","o":7005,"s":"Depreciation is non-cash operating expenses. It is deducted only for tax reporting purposes but it is added back to the net income of the project to determine net cash flow.","a":true,"e":"Depreciation is a non-cash expense; it is added back to net income to find net cash flow."},{"g":"TU 2016","o":7006,"s":"Presently a firm is selling at the term 3/15, net 45. Its sales will increase if it sells at the term 3/15, net 30.","a":false,"e":"Shortening the credit period from 45 to 30 days tightens credit, so sales will decrease."},{"g":"TU 2016","o":7007,"s":"If National bank offers 12 percent interest and applies monthly compounding, the effective interest rate of National bank is 12.68 percent.","a":true,"e":"EIR = (1 + 0.12/12)¹² − 1 = 12.68%."},{"g":"TU 2016","o":7008,"s":"Depreciation is a major component of cash budget.","a":false,"e":"Depreciation is a non-cash expense, so it is not a component of the cash budget."},{"g":"TU 2016","o":7009,"s":"Net working capital can be defined as the difference between total assets and current liabilities.","a":false,"e":"It is current assets minus current liabilities."},{"g":"TU 2015","o":8000,"s":"Wealth maximization objective of a firm emphasizes the long run profit maximization.","a":true,"e":"Wealth maximization emphasizes long-run rather than short-run profit maximization."},{"g":"TU 2015","o":8001,"s":"If the equity multiplier is 2.0, the debt ratio must be 0.50.","a":true,"e":"EM = 1/(1 − DR) → 2 = 1/(1 − DR) → DR = 0.50."},{"g":"TU 2015","o":8002,"s":"The effective annual rate is always greater than the simple rate as a result of compounding effects.","a":true,"e":"Due to compounding, EAR exceeds the nominal (simple) rate."},{"g":"TU 2015","o":8003,"s":"The CAPM predicts that a security with a beta of 0 will offer a zero expected return.","a":false,"e":"Such a security should earn at least the risk-free rate, not zero."},{"g":"TU 2015","o":8004,"s":"The bonds issued by Everest Bank Ltd. have more default risk premium than the bonds issued by Nepal Rastra Bank.","a":true,"e":"Corporate bonds carry more default risk than government-sector bonds."},{"g":"TU 2015","o":8005,"s":"The value of perpetual preferred stock is found as the dividend divided by the required rate of return.","a":true,"e":"Perpetual preferred stock has no fixed maturity, so value = dividend / required rate."},{"g":"TU 2015","o":8006,"s":"The IRR method can be used in place of the NPV method for all independent projects.","a":false,"e":"The book's answer: NPV can replace IRR for all independent projects because NPV is the more popular and reliable technique; the reverse is not used for all cases."},{"g":"TU 2015","o":8007,"s":"Aggressive working capital manager should maintain high level of current assets.","a":false,"e":"An aggressive manager maintains a low level of current assets."},{"g":"TU 2015","o":8008,"s":"Depreciation is always shown in a cash flow forecast.","a":false,"e":"Depreciation is a non-cash expense and is not included in the cash budget."},{"g":"TU 2015","o":8009,"s":"With terms of 2/10 net 30, the net credit period is 20 days.","a":false,"e":"The credit period is 30 days, not 20."},{"g":"TU 2014","o":9000,"s":"Shareholders' wealth is maximized when a decision generates profit.","a":false,"e":"Shareholders' wealth is maximized when a decision generates cash flow, not merely profit."},{"g":"TU 2014","o":9001,"s":"The nominal risk-free rate of interest includes all type of risks.","a":false,"e":"It includes only the real risk-free rate and inflation risk."},{"g":"TU 2014","o":9002,"s":"According to the liquidity preference theory, the shape of yield curve depends on the real rate of interest and average expected rate of inflation.","a":true,"e":"Long-term rates are higher than short-term rates because of more risk, so the yield curve is upward sloping."},{"g":"TU 2014","o":9003,"s":"Risk on the portfolio is less if the returns of two assets are perfectly positively correlated.","a":false,"e":"Portfolio risk is high when returns of two assets are perfectly positively correlated."},{"g":"TU 2014","o":9004,"s":"Perpetuity is a series of payment of fixed amount in equal interval of time for a given number of periods.","a":false,"e":"A perpetuity continues for an infinite number of periods."},{"g":"TU 2014","o":9005,"s":"Higher discount rate results into greater present value of future amount.","a":false,"e":"A higher discount rate results in a lower present value."},{"g":"TU 2014","o":9006,"s":"A bond is sold at premium when the market rate of return is par with coupon rate of that bond.","a":false,"e":"A bond sells at par when market rate equals coupon rate."},{"g":"TU 2014","o":9007,"s":"Intrinsic value of a stock is the price at which it is traded in the market.","a":false,"e":"Intrinsic value is the present (fair) value of the stock. Market price is set by demand and supply."},{"g":"TU 2014","o":9008,"s":"When a business enterprise finances its current assets by long-term sources of funds, the enterprise is said to adopt aggressive financing approach.","a":false,"e":"This is the relaxed (conservative) financing approach, not aggressive."},{"g":"TU 2014","o":9009,"s":"Trade credit is considered as the cost-free source of short-term financing.","a":false,"e":"Trade credit is not entirely cost-free (e.g. lost cash discounts)."},{"g":"TU 2013","o":10000,"s":"The investment decision of a firm concerned with deciding on which financing sources are to be used to finance an investment.","a":false,"e":"Investment decision is not concerned with financing sources."},{"g":"TU 2013","o":10001,"s":"Stock exchange is the market where newly issued securities are traded.","a":false,"e":"Stock exchange is where securities are re-traded (secondary market). New securities are traded through investment bankers."},{"g":"TU 2013","o":10002,"s":"Treasury yields are not influenced by inflation.","a":false,"e":"Treasury yields are influenced by inflation but not by default risk."},{"g":"TU 2013","o":10003,"s":"Primary market provides liquidity to the investors.","a":false,"e":"Secondary market provides liquidity, not the primary market."},{"g":"TU 2013","o":10004,"s":"An investor purchased a share of stock on January 1, 2012 for Rs 1,000, received dividend of Rs 50 at the end of 2012 and sold for Rs 1,350 on January 1, 2013. The investor's percentage return on the stock is 25 percent.","a":false,"e":"HPR = (1,350 − 1,000 + 50)/1,000 = 40%, not 25%."},{"g":"TU 2013","o":10005,"s":"The risk of a portfolio is less if the correlation between the returns of two assets included in the portfolio is positive.","a":false,"e":"Portfolio risk is more if the correlation is positive."},{"g":"TU 2013","o":10006,"s":"Rs 3,000 today is worth more than Rs 4,000 three years hence with the discount rate of 5 percent semiannually.","a":false,"e":"As given in the book, Rs 3,000 today is not worth more than Rs 4,000 three years hence at the stated discount rate.","n":"Check the interpretation: if 5% is applied per half-year (6 periods), PV of Rs 4,000 ≈ Rs 2,985, which would make the statement True. The book's key says False."},{"g":"TU 2013","o":10007,"s":"A bond will sell at discount when the coupon rate is greater than the required rate of return.","a":false,"e":"It will sell at a premium when coupon rate > required rate."},{"g":"TU 2013","o":10008,"s":"Intrinsic value of a security is the current price at which the stock is being traded in the market.","a":false,"e":"Intrinsic value is the present value of future cash flows, not the current market price."},{"g":"TU 2013","o":10009,"s":"A negative cash conversion cycle occurs when operating cycle is less than payable deferral period (PDP).","a":true,"e":"CCC = Operating cycle − PDP, so it is negative when the operating cycle is shorter than PDP."},{"g":"TU 2012","o":11000,"s":"An investment that promises to pay a return of Rs 100 is said to have equal risk as another investment whose earning ranges from Rs 0 to Rs 500.","a":false,"e":"The investment with a promised return has lower risk than the one with volatile returns."},{"g":"TU 2012","o":11001,"s":"Wealth maximization objective of a firm emphasizes the long-run profit maximization.","a":true,"e":"It emphasizes long-run rather than short-run profit maximization."},{"g":"TU 2012","o":11002,"s":"Receipt or payment of fixed amount of money in equal interval time for an indefinite period is called an annuity.","a":false,"e":"An annuity is a series of fixed payments at equal intervals for a definite (identified) period. Indefinite/infinite is a perpetuity.","n":"The book marks this True, but its own explanation says \"identified period\". Correct answer: False."},{"g":"TU 2012","o":11003,"s":"The term structure of interest rates represents the relationship between interest rates and the value of bonds.","a":false,"e":"It represents the relationship between interest rates and maturity period."},{"g":"TU 2012","o":11004,"s":"Sole proprietorship business can raise the funds through the issue of securities.","a":false,"e":"A sole proprietorship cannot raise funds by issuing securities."},{"g":"TU 2012","o":11005,"s":"Cash conversion cycle is the length of time between the receipt of input and cash collection from the customers.","a":false,"e":"CCC is the time between cash payment to suppliers for input and cash collection from customers."},{"g":"TU 2012","o":11006,"s":"Primary emphasis of modern financial management is on the raising of funds.","a":false,"e":"Modern financial management emphasizes both raising and utilizing funds."},{"g":"TU 2012","o":11007,"s":"Short-term finance is often used to acquire fixed assets.","a":false,"e":"Fixed assets are usually financed with long-term funds."},{"g":"TU 2012","o":11008,"s":"Dividend yield is dividend divided by stock's par value.","a":false,"e":"Dividend yield = expected dividend ÷ market price of stock, not par value."},{"g":"TU 2012","o":11009,"s":"Future value interest factor is used in discounting the value of money.","a":false,"e":"FVIF is used in compounding, not discounting."},{"g":"TU 2011","o":12000,"s":"Finance is related with the acquisition, allocation, management, and efficient utilization of firm's financial resources.","a":true,"e":"This is the standard scope of finance."},{"g":"TU 2011","o":12001,"s":"The expectation theory states that the yields on long-term debt is higher than short-term debt because long-term debts are illiquid than short-term debts.","a":true,"e":"As per the book, long-term debt yields are higher because they are less liquid than short-term debt.","n":"Strictly, the liquidity premium is the liquidity preference theory's explanation, but the book's key is True."},{"g":"TU 2011","o":12002,"s":"At 10% interest rate, Rs 1000 today is worth more than Rs 1,600 five years from today.","a":true,"e":"At 10%, Rs 1,000 grows to about Rs 1,610.51 in five years, which is more than Rs 1,600.","n":"The book writes Rs 1,771.56 here, but 1,000 × (1.10)⁵ = Rs 1,610.51. The answer (True) is the same."},{"g":"TU 2011","o":12003,"s":"The risk of a portfolio consisting of two negatively correlated stocks will be lesser than the portfolio consisting of positively correlated stocks.","a":true,"e":"Negative correlation offsets movements and lowers portfolio risk."},{"g":"TU 2011","o":12004,"s":"The interest also called coupon provided on bonds changes over time.","a":false,"e":"Coupon on a bond is fixed and does not change over time."},{"g":"TU 2011","o":12005,"s":"The price of bond moves positively with the market interest rate.","a":false,"e":"Bond price moves negatively (inversely) with market interest rate."},{"g":"TU 2011","o":12006,"s":"Discounted interest, compensating balance, and commitment fee increase the true or effective cost of loan.","a":true,"e":"Each reduces usable funds or adds cost, raising the effective cost of the loan."},{"g":"TU 2011","o":12007,"s":"A firm with a higher cash conversion cycle requires lesser amount of working capital.","a":false,"e":"A firm with a lower cash conversion cycle requires less working capital."},{"g":"TU 2011","o":12008,"s":"The returns investors receive from holding common stocks may be in two forms: (a) interest yield and (b) capital gains.","a":false,"e":"Common stock returns come as dividend yield and capital gains, not interest yield."},{"g":"TU 2011","o":12009,"s":"The net working capital is the current assets minus current liabilities.","a":true,"e":"Net working capital = Current assets − Current liabilities."},{"g":"TU 2010","o":13000,"s":"Primary emphasis of modern financial management is on the raising of funds.","a":false,"e":"It is not only raising funds; funds must also be utilized."},{"g":"TU 2010","o":13001,"s":"Coefficient of variation is the absolute measure of the riskiness of business.","a":false,"e":"CV is a relative measure of risk, not absolute."},{"g":"TU 2010","o":13002,"s":"Portfolio return on the investment in two assets is the average return on these assets.","a":false,"e":"Portfolio return is the weighted combination of the assets' returns, not a simple average."},{"g":"TU 2010","o":13003,"s":"Two assets whose returns move in the opposite direction and have a negative correlation coefficient are either risk-free assets or low risk assets.","a":true,"e":"Combining assets with opposite movements results in low risk or risk-free assets."},{"g":"TU 2010","o":13004,"s":"The loan to be repaid in equal periodic installments is called amortized loan.","a":true,"e":"That is the definition of an amortized loan."},{"g":"TU 2010","o":13005,"s":"Perpetuity refers to the receipt of payments of fixed amount of money in an equal interval of time for a definite period.","a":false,"e":"A perpetuity continues for an infinite period, not a definite period."},{"g":"TU 2010","o":13006,"s":"The value of a bond decreases when its coupon rate is greater than required rate of return.","a":false,"e":"When coupon rate exceeds the required rate, the bond's value increases (it sells at a premium)."},{"g":"TU 2010","o":13007,"s":"Dividend yield is dividend by stock's par value.","a":false,"e":"Dividend yield is expected dividend divided by market price, not par value."},{"g":"TU 2010","o":13008,"s":"Short-term finance is often used to acquire fixed assets.","a":false,"e":"Short-term finance is not often used to acquire fixed assets."},{"g":"TU 2010","o":13009,"s":"Yield on Treasury bill is exposed to the maturity risk premium.","a":false,"e":"T-bills are short-term securities, so maturity risk premium is assumed to be absent."},{"g":"TU 2009","o":14000,"s":"Financial manager places primary importance on cash flows.","a":true,"e":"Financial managers focus on cash flows rather than accounting profit."},{"g":"TU 2009","o":14001,"s":"In lump sum payment today is equal to the present value of three years annuity of Rs 1,000 each year discounted at a given rate of return; we would not be indifferent in choosing either of the alternatives.","a":true,"e":"This is the book's answer (True).","n":"This statement reads oddly: if the lump sum equals the PV of the annuity, you would normally be indifferent. It's likely a misprint, but the book's key is True."},{"g":"TU 2009","o":14002,"s":"From the issuer's point of view preferred stock is less risky than bonds.","a":true,"e":"If the issuer misses preferred dividends there's no forced liquidation, whereas missed bond interest/principal can push the firm into liquidation."},{"g":"TU 2009","o":14003,"s":"A firm with high interest cost and high preferred stock dividend has high financial risk.","a":true,"e":"High fixed financial charges increase financial risk."},{"g":"TU 2009","o":14004,"s":"Factoring is the source of short team financing.","a":true,"e":"Factoring is a secured short-term source as a part of accounts receivable financing."},{"g":"TU 2009","o":14005,"s":"Financing with convertibles doesn't dilute earning per share.","a":false,"e":"Financing with convertibles will dilute earnings per share once converted.","n":"The book labels this True, but its own explanation says convertibles will dilute EPS, so the correct answer is False."},{"g":"TU 2009","o":14006,"s":"An indenture is a legal agreement which deals the conditions associated with the bond issue.","a":true,"e":"An indenture is the legal agreement covering the bond issue's conditions."},{"g":"TU 2009","o":14007,"s":"Break even point is that level of activity where sales equals to variable cost.","a":false,"e":"Break-even is where there is no profit and no loss (sales = total cost), not sales = variable cost."},{"g":"TU 2009","o":14008,"s":"Given the monthly periodic rate of 1 percent, an effective annual percentage rate is 12 percent.","a":false,"e":"EAR = (1.01)¹² − 1 = 12.68%, not 12%."},{"g":"TU 2009","o":14009,"s":"Compensating balance increases the effective cost of bank loan.","a":true,"e":"It reduces the usable loan amount while interest is paid on the full amount."},{"g":"TU 2008","o":15000,"s":"For a firm wealth maximization goal is preferable to profit maximization goal.","a":true,"e":"Wealth maximization accounts for timing, risk and cash flows, so it is preferred over profit maximization.","n":"The book marks this False with a garbled explanation, but elsewhere (e.g. TU 2017 Q1) it says wealth maximization is superior. The standard answer is True."},{"g":"TU 2008","o":15001,"s":"The more frequently interest is compounded at a given rate (nominal rate), the greater the amount of money (FV) accumulated.","a":true,"e":"More frequent compounding earns interest on interest more often."},{"g":"TU 2008","o":15002,"s":"If monthly periodic rate of interest is 1.5 percent, the effective annual rate is 18 percent.","a":false,"e":"EAR = (1 + 0.015)¹² − 1 = 19.56%, not 18%."},{"g":"TU 2008","o":15003,"s":"Degree of combined leverage is the sum of the degree of operating and financial leverage.","a":false,"e":"DCL = DOL × DFL, the product, not the sum.","n":"The book marks this True, but combined leverage is the product of operating and financial leverage, so the correct answer is False."},{"g":"TU 2008","o":15004,"s":"Use of large amount of debt capital increases the business risk of the firm.","a":false,"e":"Debt increases financial risk, not business risk."},{"g":"TU 2008","o":15005,"s":"Preferred stock holders have preferential voting rights over common stock holders.","a":false,"e":"Preferred stockholders generally have no preferential voting rights."},{"g":"TU 2008","o":15006,"s":"Given the invoice date of 'September 10' and terms of credit as '2/10 net 30 EOM', the payment date without cash discount is October 30.","a":true,"e":"Under EOM terms, the 30 days count from the end of the month (Sept 30), giving October 30."},{"g":"TU 2008","o":15007,"s":"Compensating balance increases the effective cost of bank loan.","a":true,"e":"It reduces usable funds while interest is on the full loan."},{"g":"TU 2008","o":15008,"s":"The conversion price of bond issued at Rs 1,000 par value with conversion ratio of 25% is Rs 50.","a":false,"e":"As per the book, the conversion price at a 25% ratio is Rs 250, not Rs 50."},{"g":"TU 2008","o":15009,"s":"If you have purchased a call option, you can buy the underlying stock at predetermined price at any time in the future.","a":false,"e":"A call option gives the right to buy at a predetermined price within a specific period, not at any time in the future."},{"g":"TU 2007 (Q1–9)","o":16000,"s":"The investment decision of a firm is concerned with deciding on which financing sources are to be used to finance an investment.","a":false,"e":"Investment decision is about which assets should be purchased, not which financing sources to use."},{"g":"TU 2007 (Q1–9)","o":16001,"s":"When a company requires fund it may raise it by selling shares in secondary market.","a":false,"e":"A company raises funds by selling shares in the primary market."},{"g":"TU 2007 (Q1–9)","o":16002,"s":"Maturity risk is assume to be absent in treasury bills.","a":true,"e":"Treasury bills are short-term securities, so maturity risk is assumed absent."},{"g":"TU 2007 (Q1–9)","o":16003,"s":"Other things being constant; increase in fixed cost increases breakeven point.","a":true,"e":"Higher fixed costs require more sales to break even."},{"g":"TU 2007 (Q1–9)","o":16004,"s":"Among common stock, preferred stock and bond, the issue of bond keeps the capital structure of a firm more flexible.","a":true,"e":"Bonds can be redeemed, which makes the capital structure more flexible."},{"g":"TU 2007 (Q1–9)","o":16005,"s":"According to the expectancy theory the yield curve is upward sloping if inflation is expected to increase in the coming several years.","a":true,"e":"Expected rising inflation raises expected future short rates, producing an upward-sloping curve."},{"g":"TU 2007 (Q1–9)","o":16006,"s":"If your investment doubles in ten years, you are approximately 9% return in a year.","a":false,"e":"Doubling in 10 years means about 7.18% a year (1.0718¹⁰ ≈ 2), not 9%.","n":"The book quotes 8.04%; the precise figure is 7.18%. Either way, 9% is wrong."},{"g":"TU 2007 (Q1–9)","o":16007,"s":"The conversion price of a bond issued at Rs 1,000 par value with conversion ratio of 25 is Rs 50.","a":false,"e":"Conversion price = par value ÷ conversion ratio = 1,000 ÷ 25 = Rs 40, not Rs 50. (The book's key gives Rs 250 reading 25%.)"},{"g":"TU 2007 (Q1–9)","o":16008,"s":"A put option is an option to buy a share of stock at predetermined price within a specified period.","a":false,"e":"A put option is the right to sell, not buy, at a predetermined price within a specified period."}];
firebase.initializeApp({apiKey:"AIzaSyBf8Hvh6y-brtQcHRo6DesVj4i2SrgdnMg",authDomain:"osaquiz.firebaseapp.com",projectId:"osaquiz",appId:"1:427866798589:web:55b4cab5fcd7f0aacc8194"});
const db=firebase.firestore(), col=db.collection("questions");
document.getElementById("n").textContent=DATA.length;
const log=m=>document.getElementById("log").textContent=m;
document.getElementById("go").onclick=async function(){
  this.disabled=true;
  try{
    const ex=await col.limit(1).get();
    if(!ex.empty && !confirm("The questions collection already has data. Import anyway (this will create duplicates)?")){ this.disabled=false; return; }
    for(let i=0;i<DATA.length;i+=400){
      const b=db.batch();
      DATA.slice(i,i+400).forEach(q=>b.set(col.doc(),q));
      await b.commit();
      log("Imported "+Math.min(i+400,DATA.length)+" / "+DATA.length);
    }
    log("Done! "+DATA.length+" questions are now in Firebase. Delete import.html from your repo.");
  }catch(e){ log("Failed: "+e.message+"\nCheck your Firestore rules allow creating in 'questions'."); this.disabled=false; }
};
