<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Finance – True or False</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1b1f27;--muted:#5d6675;--line:#e1e5ec;
  --accent:#2f5bea;--ok:#12805c;--okbg:#e5f6ef;--bad:#c0392b;--badbg:#fdeceb;--note:#8a5a00;--notebg:#fff4d6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12141a;--card:#1c2029;--text:#e8ebf2;--muted:#9aa3b5;--line:#2c3240;
  --accent:#7b97ff;--ok:#4fd1a1;--okbg:#12342a;--bad:#ff8a7d;--badbg:#3a1d1a;--note:#f3c969;--notebg:#3a2f12;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.15rem;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],button.tool{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button.tool{cursor:pointer}
button.tool.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{margin-left:auto;font-size:.9rem;color:var(--muted)}
.stats b{color:var(--text)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
main{padding:16px}
.setlabel{margin:22px 0 10px;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.qn{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.q{font-weight:600;margin:0 0 12px}
.opts{display:flex;gap:10px}
.opt{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.picked.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.picked.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt.answer{border-color:var(--ok)}
.exp{display:none;margin-top:12px;padding:12px;border-radius:10px;font-size:.95rem}
.exp.show{display:block}
.exp.right{background:var(--okbg)}
.exp.wrong{background:var(--badbg)}
.exp .verdict{font-weight:700;margin-bottom:4px}
.exp.right .verdict{color:var(--ok)}
.exp.wrong .verdict{color:var(--bad)}
.note{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--notebg);color:var(--note);font-size:.85rem}
.del{float:right;background:none;border:none;color:var(--bad);cursor:pointer;font:inherit;font-size:.8rem}
.qtools{float:right;display:flex;gap:10px}
.qtools button{background:none;border:none;cursor:pointer;font:inherit;font-size:.8rem;padding:0}
.qtools .edit{color:var(--accent)}
.qtools .del{float:none;color:var(--bad)}
.qtools .ai{color:var(--accent);font-weight:600}
.ai-panel{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.ai-panel.show{display:block}
.ai-log{max-height:340px;overflow:auto;font-size:.95rem}
.ai-msg{padding:10px 12px;border-radius:10px;margin-bottom:8px;background:var(--bg);overflow-wrap:anywhere}
.ai-msg.me{background:var(--okbg);text-align:right}
.ai-msg p{margin:0 0 .6em}.ai-msg p:last-child{margin:0}
.ai-msg ul,.ai-msg ol{margin:.2em 0 .6em;padding-left:1.3em}
.ai-msg code{background:var(--line);padding:1px 5px;border-radius:4px;font-size:.9em}
.ai-msg pre{background:var(--line);padding:8px;border-radius:8px;overflow:auto}
.ai-msg h3,.ai-msg h4{margin:.4em 0 .3em;font-size:1rem}
.ai-ask{display:flex;gap:8px;margin-top:8px}
.ai-ask input{flex:1;min-width:0}
body:not(.is-admin) .admin-only{display:none!important}
.lbrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px}
.lbrow:nth-child(odd){background:var(--bg)}
.lbrow.me{outline:2px solid var(--accent)}
.lbrow .rk{width:2em;font-weight:700;color:var(--muted)}
.lbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .sc{font-variant-numeric:tabular-nums}
.msg{text-align:center;color:var(--muted);padding:40px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);width:min(520px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 12px;font-size:1.05rem}
dialog label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
dialog textarea,dialog input[type=text],dialog select{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
dialog textarea{resize:vertical}
.radios{display:flex;gap:16px}
.radios label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:1rem}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:8px;min-height:1em}
.result{display:none;text-align:center;padding:20px;margin:10px 0 40px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.result.show{display:block}
.result .big{font-size:2rem;font-weight:800;color:var(--accent)}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
</head>
<body>
<header><div class="wrap">
  <h1>Business Finance – True or False</h1>
  <div class="row">
    <select id="setSel" aria-label="Choose question set"><option>Loading…</option></select>
    <button class="tool" id="shuf">Shuffle</button>
    <button class="tool" id="reset">Reset</button>
    <button class="tool" id="lbBtn">🏆 Leaderboard</button>
    <button class="tool" id="authBtn">Sign in with Google</button>
    <button class="tool" id="keyBtn">🔑 Gemini</button>
    <button class="tool primary admin-only" id="addBtn">+ Add question</button>
    <span class="stats">Answered <b id="sAns">0</b>/<b id="sTot">0</b> · Correct <b id="sOk">0</b></span>
  </div>
  <div class="bar"><i id="prog"></i></div>
</div></header>
<main>
  <div class="wrap" id="list"><div class="msg">Loading questions…</div></div>
  <div class="wrap"><div class="result" id="result"><div class="big" id="rScore"></div><div id="rMsg"></div></div></div>
</main>

<dialog id="lbDlg">
  <h2>🏆 Leaderboard</h2>
  <div id="lbList">Loading…</div>
  <div class="dlgbtns"><button type="button" class="tool" onclick="document.getElementById('lbDlg').close()">Close</button></div>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="addForm">
    <h2 id="dTitle">Add a question</h2>
    <label for="fSet">Set</label>
    <select id="fSet"></select>
    <input type="text" id="fNewSet" placeholder="New set name" style="display:none;margin-top:6px">
    <label for="fStmt">Statement</label>
    <textarea id="fStmt" rows="3" placeholder="e.g. Higher discount rate results in lower present value."></textarea>
    <label>Correct answer</label>
    <div class="radios">
      <label><input type="radio" name="fAns" value="1" checked> True</label>
      <label><input type="radio" name="fAns" value="0"> False</label>
    </div>
    <label for="fExp">Explanation (shown after answering)</label>
    <textarea id="fExp" rows="3"></textarea>
    <label for="fNote">Note (optional, shown in yellow)</label>
    <textarea id="fNote" rows="2"></textarea>
    <div class="err" id="fErr"></div>
    <div class="dlgbtns">
      <button type="button" class="tool" id="fCancel">Cancel</button>
      <button type="submit" class="tool primary" id="fSave">Save question</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBf8Hvh6y-brtQcHRo6DesVj4i2SrgdnMg",
  authDomain: "osaquiz.firebaseapp.com",
  databaseURL: "https://osaquiz-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "osaquiz",
  storageBucket: "osaquiz.firebasestorage.app",
  messagingSenderId: "427866798589",
  appId: "1:427866798589:web:55b4cab5fcd7f0aacc8194",
  measurementId: "G-FY68W64X1J"
};
firebase.initializeApp(firebaseConfig);
const col = firebase.firestore().collection("questions");

const $ = id => document.getElementById(id);
const list = $("list"), sel = $("setSel");
const PROG_KEY = "tuQuizProgressV2";
let state = {};
try{ state = JSON.parse(localStorage.getItem(PROG_KEY)||"{}") || {}; }catch(e){ state = {}; }
function saveState(){ try{ localStorage.setItem(PROG_KEY, JSON.stringify(state)); }catch(e){} }

let all = [];        // [{id,g,o,s,a,e,n}]
let groups = [];     // ordered group names
let visible = [];
let shuffled = false;
let selectGroupNext = null;

// ---- load from Firestore (live) ----
col.orderBy("o").onSnapshot(snap=>{
  all = snap.docs.map(d=>({id:d.id, ...d.data()}));
  const seen = new Set(); groups = [];
  all.forEach(q=>{ if(!seen.has(q.g)){ seen.add(q.g); groups.push(q.g); } });
  const keep = selectGroupNext!==null ? selectGroupNext : sel.value;
  selectGroupNext = null;
  fillSel(keep); build(); scheduleSync();
}, err=>{
  console.error(err);
  list.innerHTML = '<div class="msg">Could not load questions from Firebase.<br>Check that Firestore is created and the rules allow reading the <b>questions</b> collection.</div>';
});

function fillSel(keep){
  sel.innerHTML = '<option value="all">All sets ('+all.length+' questions)</option>' +
    groups.map((g,i)=>'<option value="'+i+'">'+esc(g)+' ('+all.filter(q=>q.g===g).length+')</option>').join("");
  const k = typeof keep==="string" && keep.startsWith("g:") ? String(groups.indexOf(keep.slice(2))) : keep;
  sel.value = k!==undefined && [...sel.options].some(o=>o.value===String(k)) ? String(k) : "all";
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function build(){
  const v = sel.value;
  let items = all.filter(q=> v==="all" || groups[+v]===q.g );
  if(shuffled){ for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];} }
  visible = items;
  list.innerHTML = "";
  if(!items.length){ list.innerHTML='<div class="msg">No questions yet. Use “+ Add question”.</div>'; stats(); return; }
  let last=null, n=0;
  items.forEach(q=>{
    if(!shuffled && q.g!==last){ const h=document.createElement("div"); h.className="setlabel"; h.textContent=q.g; list.appendChild(h); last=q.g; n=0; }
    n++;
    const c=document.createElement("div"); c.className="card"; c.id="c"+q.id;
    c.innerHTML='<div class="qn"><span class="qlabel"></span><span class="qtools"><button class="ai">✨ Explain</button><button class="edit admin-only">Edit</button><button class="del admin-only">Delete</button></span></div>'+
      '<p class="q"></p><div class="opts"><button class="opt" data-v="1">True</button><button class="opt" data-v="0">False</button></div>'+
      '<div class="exp"><div class="verdict"></div><div class="body"></div></div>'+
      '<div class="ai-panel"><div class="ai-log"></div><div class="ai-ask"><input type="text" placeholder="Ask a follow-up…"><button class="tool primary">Send</button></div></div>';
    c.querySelector(".qlabel").textContent=(shuffled? q.g+" · ":"")+"Q"+n;
    c.querySelector(".q").textContent=q.s;
    c.querySelector(".del").addEventListener("click",()=>{
      if(!confirm("Delete this question for everyone?")) return;
      delete state[q.id]; saveState();
      col.doc(q.id).delete().catch(err=>alert("Delete failed: "+err.message));
    });
    c.querySelector(".edit").addEventListener("click",()=>openEditor(q));
    setupAI(c,q);
    c.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(q,b.dataset.v==="1")));
    list.appendChild(c);
    if(q.id in state) paint(q);
  });
  stats();
}

function answer(q,val){ if(q.id in state) return; state[q.id]=val; saveState(); paint(q); stats(); scheduleSync(); }

function paint(q){
  const c=$("c"+q.id), chosen=state[q.id], correct=!!q.a, ok=chosen===correct;
  c.querySelectorAll(".opt").forEach(b=>{
    const v=b.dataset.v==="1"; b.disabled=true;
    if(v===chosen) b.classList.add("picked", ok?"right":"wrong");
    if(v===correct && !ok) b.classList.add("answer");
  });
  const e=c.querySelector(".exp"); e.classList.add("show", ok?"right":"wrong");
  e.querySelector(".verdict").textContent = (ok?"✓ Correct — ":"✗ Not quite — ")+"the statement is "+(correct?"True":"False");
  const body=e.querySelector(".body"); body.textContent=q.e||"";
  if(q.n){ const n=document.createElement("div"); n.className="note"; n.textContent="Note: "+q.n; body.appendChild(n); }
}

function stats(){
  let ans=0, ok=0;
  visible.forEach(q=>{ if(q.id in state){ ans++; if(state[q.id]===!!q.a) ok++; } });
  $("sAns").textContent=ans; $("sTot").textContent=visible.length; $("sOk").textContent=ok;
  $("prog").style.width = visible.length ? (100*ans/visible.length)+"%" : "0";
  const r=$("result");
  if(visible.length && ans===visible.length){
    const p=Math.round(100*ok/ans);
    $("rScore").textContent=ok+" / "+ans+" ("+p+"%)";
    $("rMsg").textContent = p>=80?"Excellent work!":p>=60?"Good — review the ones you missed.":"Keep practising — read the explanations again.";
    r.classList.add("show");
  } else r.classList.remove("show");
}

sel.addEventListener("change",()=>{ build(); window.scrollTo(0,0); });
$("shuf").addEventListener("click",()=>{ shuffled=!shuffled; $("shuf").textContent=shuffled?"Unshuffle":"Shuffle"; build(); });
$("reset").addEventListener("click",()=>{ if(!confirm("Clear all your answers and start over?")) return; state={}; saveState(); build(); scheduleSync(); window.scrollTo(0,0); });

// ---- Google sign-in, per-user progress, leaderboard, admin ----
const ADMIN_EMAIL = "YOUR_EMAIL@gmail.com";   // ← only this Google account can add / edit / delete questions
const auth = firebase.auth(), fsdb = firebase.firestore();
let user = null, syncTimer = null;
function isAdmin(){ return !!user && !!user.email && user.emailVerified && user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase(); }
function applyAuthUI(){
  document.body.classList.toggle("is-admin", isAdmin());
  $("authBtn").textContent = user ? "Sign out ("+String(user.displayName||user.email||"you").split(" ")[0]+")" : "Sign in with Google";
}
$("authBtn").addEventListener("click",()=>{
  if(user){ auth.signOut(); return; }
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{
    if(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request") return;
    alert("Sign-in failed: "+e.message+(e.code==="auth/unauthorized-domain"?"\nAdd this website's domain in Firebase → Authentication → Settings → Authorized domains.":""));
  });
});
auth.onAuthStateChanged(async u=>{
  const was=user; user=u; applyAuthUI();
  if(!u){ if(was){ state={}; saveState(); build(); } return; }   // signed out: don't leave progress on a shared device
  try{
    const s=await fsdb.collection("users").doc(u.uid).get();
    const remote=(s.exists && s.data().answers) || {};
    state={...remote,...state}; saveState(); build(); scheduleSync();
  }catch(e){ console.warn("Could not load saved progress:",e.message); }
});
function scheduleSync(){ if(!user) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,700); }
function syncNow(){
  if(!user || !all.length) return;
  let answered=0, correct=0;
  all.forEach(q=>{ if(q.id in state){ answered++; if(state[q.id]===!!q.a) correct++; } });
  fsdb.collection("users").doc(user.uid).set({answers:state,updated:Date.now()}).catch(e=>console.warn("Progress not saved:",e.message));
  fsdb.collection("leaderboard").doc(user.uid).set({name:String(user.displayName||"Student").slice(0,60),answered,correct,t:Date.now()}).catch(e=>console.warn("Leaderboard not updated:",e.message));
}
$("lbBtn").addEventListener("click",async()=>{
  const box=$("lbList"); box.textContent="Loading…"; $("lbDlg").showModal();
  if(!user){ box.textContent="Sign in with Google to see the leaderboard and appear on it."; return; }
  try{
    const s=await fsdb.collection("leaderboard").orderBy("correct","desc").limit(20).get();
    if(s.empty){ box.textContent="No scores yet — answer some questions!"; return; }
    box.innerHTML=""; let i=0;
    s.forEach(d=>{
      const x=d.data(); i++;
      const r=document.createElement("div"); r.className="lbrow"+(d.id===user.uid?" me":"");
      const pct = x.answered ? Math.round(100*x.correct/x.answered) : 0;
      r.innerHTML='<span class="rk">'+i+'</span><span class="nm"></span><span class="sc">'+x.correct+" / "+x.answered+" ("+pct+"%)</span>";
      r.querySelector(".nm").textContent=x.name||"Student";
      box.appendChild(r);
    });
  }catch(e){ box.textContent="Could not load the leaderboard: "+e.message; }
});

// ---- add / edit question ----
const dlg=$("dlg"), fSet=$("fSet");
let editing=null;
fSet.addEventListener("change",()=>{ $("fNewSet").style.display = fSet.value==="__new" ? "block":"none"; });
function fillSetOptions(selectedGroup){
  fSet.innerHTML = groups.map((g,i)=>'<option value="'+i+'">'+esc(g)+'</option>').join("") + '<option value="__new">+ New set…</option>';
  const idx = groups.indexOf(selectedGroup);
  fSet.value = idx>=0 ? String(idx) : "__new";
  $("fNewSet").value=""; $("fNewSet").style.display = fSet.value==="__new" ? "block":"none";
}
$("addBtn").addEventListener("click",()=>{
  editing=null; $("addForm").reset(); $("fErr").textContent=""; $("dTitle").textContent="Add a question"; $("fSave").textContent="Save question";
  const v=sel.value; fillSetOptions(v!=="all" ? groups[+v] : null);
  dlg.showModal(); $("fStmt").focus();
});
function openEditor(q){
  editing=q; $("addForm").reset(); $("fErr").textContent=""; $("dTitle").textContent="Edit question"; $("fSave").textContent="Save changes";
  fillSetOptions(q.g);
  $("fStmt").value=q.s||""; $("fExp").value=q.e||""; $("fNote").value=q.n||"";
  document.querySelector('input[name="fAns"][value="'+(q.a?1:0)+'"]').checked=true;
  dlg.showModal(); $("fStmt").focus();
}
$("fCancel").addEventListener("click",()=>dlg.close());
function nextOrder(g){
  const inSet = all.filter(q=>q.g===g);
  const maxAll = all.reduce((m,q)=>Math.max(m,q.o),0);
  return inSet.length ? Math.max(...inSet.map(q=>q.o)) + 0.001 + Math.random()*0.0005 : (Math.floor(maxAll/1000)+1)*1000;
}
$("addForm").addEventListener("submit",e=>{
  const stmt=$("fStmt").value.trim();
  const g = fSet.value==="__new" ? $("fNewSet").value.trim() : groups[+fSet.value];
  if(!stmt || !g){ e.preventDefault(); $("fErr").textContent = !g ? "Please enter a set name." : "Please enter a statement."; return; }
  const a = document.querySelector('input[name="fAns"]:checked').value==="1";
  const ex = $("fExp").value.trim() || ("The statement is "+(a?"True":"False")+".");
  const note = $("fNote").value.trim();
  if(editing){
    const q=editing, upd={g,s:stmt,a,e:ex,n: note || firebase.firestore.FieldValue.delete()};
    if(g!==q.g){ upd.o=nextOrder(g); selectGroupNext="g:"+g; }
    col.doc(q.id).update(upd).catch(err=>{ selectGroupNext=null; alert("Save failed: "+err.message+"\nCheck that your Firestore rules allow updating the questions collection."); });
  } else {
    const doc={g,o:nextOrder(g),s:stmt,a,e:ex}; if(note) doc.n=note;
    selectGroupNext="g:"+g;
    col.add(doc).catch(err=>{ selectGroupNext=null; alert("Save failed: "+err.message+"\nCheck your Firestore rules."); });
    setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),400);
  }
});

// ---- markdown + math rendering (safe: everything is escaped first) ----
const SYM={"\\rightarrow":"→","\\to":"→","\\Rightarrow":"⇒","\\leftarrow":"←","\\times":"×","\\cdot":"·","\\div":"÷","\\leq":"≤","\\geq":"≥","\\neq":"≠","\\approx":"≈","\\%":"%","\\$":"$","\\sigma":"σ","\\beta":"β","\\alpha":"α"};
function mathHTML(tex,display){
  try{ if(window.katex) return katex.renderToString(tex,{throwOnError:false,displayMode:display}); }catch(e){}
  let t=tex.replace(/\\(text|mathrm|mathbf)\{([^}]*)\}/g,"$2").replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,"($1)/($2)");
  Object.keys(SYM).sort((a,b)=>b.length-a.length).forEach(k=>{ t=t.split(k).join(SYM[k]); });
  return '<span>'+esc(t)+'</span>';
}
function inline(s){
  return s.replace(/`([^`]+)`/g,"<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
          .replace(/__([^_]+)__/g,"<strong>$1</strong>")
          .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,"$1<em>$2</em>");
}
function renderMD(src){
  const maths=[];
  let s=String(src||"").replace(/\\\$/g,"\u0001").replace(/\$(?=\d)/g,"\u0001"); // currency like $10,000 is not math
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>{ maths.push(mathHTML(t.trim(),true)); return "\u0000"+(maths.length-1)+"\u0000"; });
  s=s.replace(/\\\[([\s\S]+?)\\\]/g,(m,t)=>{ maths.push(mathHTML(t.trim(),true)); return "\u0000"+(maths.length-1)+"\u0000"; });
  s=s.replace(/\\\(([\s\S]+?)\\\)/g,(m,t)=>{ maths.push(mathHTML(t.trim(),false)); return "\u0000"+(maths.length-1)+"\u0000"; });
  s=s.replace(/\$([^$\n]+?)\$/g,(m,t)=>{ if(/^\s|\s$/.test(t) && !/\\/.test(t)) return m; maths.push(mathHTML(t.trim(),false)); return "\u0000"+(maths.length-1)+"\u0000"; });
  s=esc(s);
  const lines=s.split("\n"), out=[]; let list=null, para=[], code=null;
  const flushP=()=>{ if(para.length){ out.push("<p>"+inline(para.join("<br>"))+"</p>"); para=[]; } };
  const flushL=()=>{ if(list){ out.push("</"+list+">"); list=null; } };
  lines.forEach(l=>{
    if(/^```/.test(l)){ if(code===null){ flushP(); flushL(); code=[]; } else { out.push("<pre><code>"+code.join("\n")+"</code></pre>"); code=null; } return; }
    if(code!==null){ code.push(l); return; }
    let m;
    if((m=l.match(/^\s*#{1,6}\s+(.*)$/))){ flushP(); flushL(); out.push("<h4>"+inline(m[1])+"</h4>"); }
    else if((m=l.match(/^\s*[*\-•]\s+(.*)$/))){ flushP(); if(list!=="ul"){ flushL(); out.push("<ul>"); list="ul"; } out.push("<li>"+inline(m[1])+"</li>"); }
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if(list!=="ol"){ flushL(); out.push("<ol>"); list="ol"; } out.push("<li>"+inline(m[1])+"</li>"); }
    else if(!l.trim()){ flushP(); flushL(); }
    else { flushL(); para.push(l); }
  });
  if(code!==null) out.push("<pre><code>"+code.join("\n")+"</code></pre>");
  flushP(); flushL();
  return out.join("").replace(/\u0000(\d+)\u0000/g,(m,i)=>maths[+i]).replace(/\u0001/g,"$");
}

// ---- Gemini explain ----
const GEMINI_MODEL="gemini-2.5-flash", KEY_STORE="geminiApiKey";
// Paste your Gemini API key between the quotes to make AI explanations work for every visitor without asking.
// NOTE: a key in a public page can be seen by anyone, so restrict it to your website in Google AI Studio / Cloud Console.
const GEMINI_API_KEY = "";   // optional: you can paste a key here instead, but Firestore (config/gemini → key) is used first
let fbKey = "";
const keyReady = firebase.firestore().collection("config").doc("gemini").get()
  .then(s=>{ if(s.exists && s.data().key){ fbKey=String(s.data().key).trim(); $("keyBtn").style.display="none"; } })
  .catch(err=>console.warn("Could not read config/gemini (check Firestore rules):", err.message));
const getKey=()=>{ if(fbKey) return fbKey; if(GEMINI_API_KEY) return GEMINI_API_KEY; try{ return localStorage.getItem(KEY_STORE)||""; }catch(e){ return ""; } };
if(GEMINI_API_KEY) $("keyBtn").style.display="none";
$("keyBtn").addEventListener("click",()=>{
  const k=prompt("Paste your Gemini API key (stored only in this browser):", getKey());
  if(k===null) return;
  try{ k.trim()? localStorage.setItem(KEY_STORE,k.trim()) : localStorage.removeItem(KEY_STORE); }catch(e){}
});
const chats={}; // question id -> history
async function askGemini(q,history){
  await keyReady; const key=getKey(); if(!key) throw new Error("Add your Gemini API key first (🔑 Gemini button).");
  const sys="You are a friendly Business Finance tutor for Nepali TU students. The student is studying a True/False statement. Explain clearly and briefly in simple English, with a tiny example when useful. Use plain Markdown (bold, bullet lists). Write maths in $...$ LaTeX only when needed.";
  const ctx="Statement: "+q.s+"\nCorrect answer: "+(q.a?"True":"False")+"\nBook explanation: "+(q.e||"")+(q.n?"\nNote: "+q.n:"");
  const contents=[{role:"user",parts:[{text:ctx+"\n\nStudent request: "+history[0].text}]}];
  history.slice(1).forEach(m=>contents.push({role:m.role==="me"?"user":"model",parts:[{text:m.text}]}));
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+GEMINI_MODEL+":generateContent?key="+encodeURIComponent(key),{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents})
  });
  const j=await r.json();
  if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  const t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts.map(p=>p.text||"").join("");
  if(!t) throw new Error("Empty response from Gemini.");
  return t;
}
function setupAI(card,q){
  const panel=card.querySelector(".ai-panel"), log=card.querySelector(".ai-log"), input=card.querySelector(".ai-ask input"), send=card.querySelector(".ai-ask button");
  const hist=chats[q.id]=chats[q.id]||[];
  const draw=()=>{ log.innerHTML=""; hist.forEach(m=>{ const d=document.createElement("div"); d.className="ai-msg "+(m.role==="me"?"me":"ai"); if(m.role==="me") d.textContent=m.text; else d.innerHTML=renderMD(m.text); log.appendChild(d); }); log.scrollTop=log.scrollHeight; };
  const run=async(text)=>{
    hist.push({role:"me",text}); draw(); send.disabled=true;
    const wait=document.createElement("div"); wait.className="ai-msg"; wait.textContent="Thinking…"; log.appendChild(wait); log.scrollTop=log.scrollHeight;
    try{ const t=await askGemini(q,hist); hist.push({role:"ai",text:t}); }
    catch(err){ hist.pop(); const d=document.createElement("div"); d.className="ai-msg"; d.style.color="var(--bad)"; d.textContent=err.message; wait.replaceWith(d); send.disabled=false; return; }
    send.disabled=false; draw();
  };
  card.querySelector(".ai").addEventListener("click",()=>{
    panel.classList.toggle("show");
    if(panel.classList.contains("show")){ if(!hist.length) run("Explain this statement and why the answer is "+(q.a?"True":"False")+"."); else draw(); }
  });
  const go=()=>{ const t=input.value.trim(); if(!t||send.disabled) return; input.value=""; run(t); };
  send.addEventListener("click",go);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}
