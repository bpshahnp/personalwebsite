<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Finance – True or False</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1b1f27;--muted:#5d6675;--line:#e1e5ec;
  --accent:#2f5bea;--ok:#12805c;--okbg:#e5f6ef;--bad:#c0392b;--badbg:#fdeceb;--note:#8a5a00;--notebg:#fff4d6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12141a;--card:#1c2029;--text:#e8ebf2;--muted:#9aa3b5;--line:#2c3240;
  --accent:#7b97ff;--ok:#4fd1a1;--okbg:#12342a;--bad:#ff8a7d;--badbg:#3a1d1a;--note:#f3c969;--notebg:#3a2f12;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.15rem;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],button.tool{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button.tool{cursor:pointer}
button.tool.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{margin-left:auto;font-size:.9rem;color:var(--muted)}
.stats b{color:var(--text)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
main{padding:16px}
.setlabel{margin:22px 0 10px;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.qn{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.q{font-weight:600;margin:0 0 12px}
.opts{display:flex;gap:10px}
.opt{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.picked.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.picked.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt.answer{border-color:var(--ok)}
.exp{display:none;margin-top:12px;padding:12px;border-radius:10px;font-size:.95rem}
.exp.show{display:block}
.exp.right{background:var(--okbg)}
.exp.wrong{background:var(--badbg)}
.exp .verdict{font-weight:700;margin-bottom:4px}
.exp.right .verdict{color:var(--ok)}
.exp.wrong .verdict{color:var(--bad)}
.note{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--notebg);color:var(--note);font-size:.85rem}
.del{float:right;background:none;border:none;color:var(--bad);cursor:pointer;font:inherit;font-size:.8rem}
.msg{text-align:center;color:var(--muted);padding:40px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);width:min(520px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 12px;font-size:1.05rem}
dialog label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
dialog textarea,dialog input[type=text],dialog select{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
dialog textarea{resize:vertical}
.radios{display:flex;gap:16px}
.radios label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:1rem}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:8px;min-height:1em}
.result{display:none;text-align:center;padding:20px;margin:10px 0 40px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.result.show{display:block}
.result .big{font-size:2rem;font-weight:800;color:var(--accent)}

.gem-row{margin-top:10px}
button.ask{font-size:.85rem;padding:5px 10px;color:var(--accent)}
.gem{display:none;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.gem.show{display:block}
.gm{white-space:pre-wrap;font-size:.92rem;padding:8px 10px;border-radius:8px;margin-bottom:8px}
.gm.model{background:var(--card);border:1px solid var(--line)}
.gm.user{background:var(--notebg);color:var(--note)}
.gm.err{background:var(--badbg);color:var(--bad)}
.gm.wait{color:var(--muted)}
.gin{display:flex;gap:6px}
.gin input{flex:1;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Business Finance – True or False</h1>
  <div class="row">
    <select id="setSel" aria-label="Choose question set"><option>Loading…</option></select>
    <button class="tool" id="shuf">Shuffle</button>
    <button class="tool" id="reset">Reset</button>
    <button class="tool" id="keyBtn" title="Set Gemini API key">🔑 Gemini</button>
    <button class="tool primary" id="addBtn">+ Add question</button>
    <span class="stats">Answered <b id="sAns">0</b>/<b id="sTot">0</b> · Correct <b id="sOk">0</b></span>
  </div>
  <div class="bar"><i id="prog"></i></div>
</div></header>
<main>
  <div class="wrap" id="list"><div class="msg">Loading questions…</div></div>
  <div class="wrap"><div class="result" id="result"><div class="big" id="rScore"></div><div id="rMsg"></div></div></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="addForm">
    <h2>Add a question</h2>
    <label for="fSet">Set</label>
    <select id="fSet"></select>
    <input type="text" id="fNewSet" placeholder="New set name" style="display:none;margin-top:6px">
    <label for="fStmt">Statement</label>
    <textarea id="fStmt" rows="3" placeholder="e.g. Higher discount rate results in lower present value."></textarea>
    <label>Correct answer</label>
    <div class="radios">
      <label><input type="radio" name="fAns" value="1" checked> True</label>
      <label><input type="radio" name="fAns" value="0"> False</label>
    </div>
    <label for="fExp">Explanation (shown after answering)</label>
    <textarea id="fExp" rows="3"></textarea>
    <div class="err" id="fErr"></div>
    <div class="dlgbtns">
      <button type="button" class="tool" id="fCancel">Cancel</button>
      <button type="submit" class="tool primary" id="fSave">Save question</button>
    </div>
  </form>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBf8Hvh6y-brtQcHRo6DesVj4i2SrgdnMg",
  authDomain: "osaquiz.firebaseapp.com",
  databaseURL: "https://osaquiz-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "osaquiz",
  storageBucket: "osaquiz.firebasestorage.app",
  messagingSenderId: "427866798589",
  appId: "1:427866798589:web:55b4cab5fcd7f0aacc8194",
  measurementId: "G-FY68W64X1J"
};
firebase.initializeApp(firebaseConfig);
try{ firebase.firestore().settings({experimentalAutoDetectLongPolling:true, merge:true}); }catch(e){ console.warn(e); }
const col = firebase.firestore().collection("questions");
setTimeout(()=>{ if(!loaded) list.innerHTML='<div class="msg">Still can\u2019t reach Firestore.<br>Check: internet/ad-blocker, that Firestore Database is created in project <b>osaquiz</b>, and the browser console (F12) for errors.</div>'; }, 10000);

const $ = id => document.getElementById(id);
const list = $("list"), sel = $("setSel");
const PROG_KEY = "tuQuizProgressV2";
let state = {};
try{ state = JSON.parse(localStorage.getItem(PROG_KEY)||"{}") || {}; }catch(e){ state = {}; }
function saveState(){ try{ localStorage.setItem(PROG_KEY, JSON.stringify(state)); }catch(e){} }

let loaded=false;
let all = [];        // [{id,g,o,s,a,e,n}]
let groups = [];     // ordered group names
let visible = [];
let shuffled = false;
let selectGroupNext = null;

// ---- load from Firestore (live) ----
col.orderBy("o").onSnapshot(snap=>{
  loaded=true;
  all = snap.docs.map(d=>({id:d.id, ...d.data()}));
  const seen = new Set(); groups = [];
  all.forEach(q=>{ if(!seen.has(q.g)){ seen.add(q.g); groups.push(q.g); } });
  const keep = selectGroupNext!==null ? selectGroupNext : sel.value;
  selectGroupNext = null;
  fillSel(keep); build();
}, err=>{
  console.error(err);
  list.innerHTML = '<div class="msg">Could not load questions from Firebase.<br>Check that Firestore is created and the rules allow reading the <b>questions</b> collection.</div>';
});

function fillSel(keep){
  sel.innerHTML = '<option value="all">All sets ('+all.length+' questions)</option>' +
    groups.map((g,i)=>'<option value="'+i+'">'+esc(g)+' ('+all.filter(q=>q.g===g).length+')</option>').join("");
  const k = typeof keep==="string" && keep.startsWith("g:") ? String(groups.indexOf(keep.slice(2))) : keep;
  sel.value = k!==undefined && [...sel.options].some(o=>o.value===String(k)) ? String(k) : "all";
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function build(){
  const v = sel.value;
  let items = all.filter(q=> v==="all" || groups[+v]===q.g );
  if(shuffled){ for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];} }
  visible = items;
  list.innerHTML = "";
  if(!items.length){ list.innerHTML='<div class="msg">No questions yet. Use “+ Add question”.</div>'; stats(); return; }
  let last=null, n=0;
  items.forEach(q=>{
    if(!shuffled && q.g!==last){ const h=document.createElement("div"); h.className="setlabel"; h.textContent=q.g; list.appendChild(h); last=q.g; n=0; }
    n++;
    const c=document.createElement("div"); c.className="card"; c.id="c"+q.id;
    c.innerHTML='<div class="qn"><span class="qlabel"></span><button class="del">Delete</button></div>'+
      '<p class="q"></p><div class="opts"><button class="opt" data-v="1">True</button><button class="opt" data-v="0">False</button></div>'+
      '<div class="exp"><div class="verdict"></div><div class="body"></div></div>'+
      '<div class="gem-row"><button class="tool ask">✨ Ask Gemini</button></div><div class="gem"></div>';
    c.querySelector(".qlabel").textContent=(shuffled? q.g+" · ":"")+"Q"+n;
    c.querySelector(".q").textContent=q.s;
    c.querySelector(".del").addEventListener("click",()=>{
      if(!confirm("Delete this question for everyone?")) return;
      delete state[q.id]; saveState();
      col.doc(q.id).delete().catch(err=>alert("Delete failed: "+err.message));
    });
    c.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(q,b.dataset.v==="1")));
    c.querySelector(".ask").addEventListener("click",()=>toggleGem(q,c));
    list.appendChild(c);
    if(q.id in state) paint(q);
    if(chats[q.id]) renderGem(q,c,true);
  });
  stats();
}

function answer(q,val){ if(q.id in state) return; state[q.id]=val; saveState(); paint(q); stats(); }

function paint(q){
  const c=$("c"+q.id), chosen=state[q.id], correct=!!q.a, ok=chosen===correct;
  c.querySelectorAll(".opt").forEach(b=>{
    const v=b.dataset.v==="1"; b.disabled=true;
    if(v===chosen) b.classList.add("picked", ok?"right":"wrong");
    if(v===correct && !ok) b.classList.add("answer");
  });
  const e=c.querySelector(".exp"); e.classList.add("show", ok?"right":"wrong");
  e.querySelector(".verdict").textContent = (ok?"✓ Correct — ":"✗ Not quite — ")+"the statement is "+(correct?"True":"False");
  const body=e.querySelector(".body"); body.textContent=q.e||"";
  if(q.n){ const n=document.createElement("div"); n.className="note"; n.textContent="Note: "+q.n; body.appendChild(n); }
}

function stats(){
  let ans=0, ok=0;
  visible.forEach(q=>{ if(q.id in state){ ans++; if(state[q.id]===!!q.a) ok++; } });
  $("sAns").textContent=ans; $("sTot").textContent=visible.length; $("sOk").textContent=ok;
  $("prog").style.width = visible.length ? (100*ans/visible.length)+"%" : "0";
  const r=$("result");
  if(visible.length && ans===visible.length){
    const p=Math.round(100*ok/ans);
    $("rScore").textContent=ok+" / "+ans+" ("+p+"%)";
    $("rMsg").textContent = p>=80?"Excellent work!":p>=60?"Good — review the ones you missed.":"Keep practising — read the explanations again.";
    r.classList.add("show");
  } else r.classList.remove("show");
}

sel.addEventListener("change",()=>{ build(); window.scrollTo(0,0); });
$("shuf").addEventListener("click",()=>{ shuffled=!shuffled; $("shuf").textContent=shuffled?"Unshuffle":"Shuffle"; build(); });
$("reset").addEventListener("click",()=>{ if(!confirm("Clear all your answers and start over?")) return; state={}; saveState(); build(); window.scrollTo(0,0); });

// ---- Gemini ----
const KEY_STORE="tuGeminiKey", MODEL="gemini-3.8-flash";
let cloudKey="";   // loaded from Firestore: config/gemini -> field "key"
firebase.firestore().collection("config").doc("gemini").onSnapshot(d=>{ cloudKey=(d.exists && d.data().key)||""; }, err=>console.warn("Gemini key not readable:",err.message));
const getKey=()=>{ let l=""; try{l=localStorage.getItem(KEY_STORE)||"";}catch(e){} return l||cloudKey; };
$("keyBtn").addEventListener("click",()=>{
  const k=prompt("Paste your Gemini API key (kept only in this browser's localStorage):", getKey());
  if(k!==null){ try{localStorage.setItem(KEY_STORE,k.trim());}catch(e){} }
});
const chats={};   // questionId -> [{role:'user'|'model', text}]
const SYS="You are a concise, friendly business finance tutor helping a student with True/False practice questions. Keep answers short (under 150 words unless asked), use plain language, and give a tiny numeric example when it helps.";

async function callGemini(hist){
  const key=getKey();
  if(!key) throw new Error("No API key found. Add it in Firestore (config/gemini, field "key") or paste one with the “🔑 Gemini” button.");
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":key},
    body:JSON.stringify({
      systemInstruction:{parts:[{text:SYS}]},
      contents:hist.map(m=>({role:m.role,parts:[{text:m.text}]}))
    })
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  const t=(((j.candidates||[])[0]||{}).content||{}).parts;
  return t? t.map(p=>p.text||"").join("") : "(No response – the answer may have been blocked.)";
}

function firstPrompt(q){
  const base='Statement: "'+q.s+'"\n';
  if(q.id in state){
    const ok=state[q.id]===!!q.a;
    return base+"Correct answer: "+(q.a?"True":"False")+". The student answered "+(state[q.id]?"True":"False")+" ("+(ok?"correct":"wrong")+")."+
      (q.e?"\nBook explanation: "+q.e:"")+"\nExplain the concept behind this in simple terms, and why a student might get it wrong.";
  }
  return base+"The student hasn't answered yet. Give a short hint about the concept WITHOUT revealing whether it is True or False.";
}

function toggleGem(q,c){
  const g=c.querySelector(".gem");
  if(g.classList.contains("show")){ g.classList.remove("show"); return; }
  if(!chats[q.id]){ chats[q.id]=[]; renderGem(q,c,true); send(q,c,firstPrompt(q),true); }
  else renderGem(q,c,true);
}

function renderGem(q,c,open){
  const g=c.querySelector(".gem"); g.innerHTML="";
  const box=document.createElement("div"); g.appendChild(box);
  chats[q.id].forEach((m,i)=>{
    if(i===0 && m.role==="user") return;   // hide the auto-generated prompt
    const d=document.createElement("div"); d.className="gm "+(m.err?"err":m.role); d.textContent=m.text; box.appendChild(d);
  });
  const row=document.createElement("div"); row.className="gin";
  row.innerHTML='<input type="text" placeholder="Ask a follow-up…"><button class="tool primary">Send</button>';
  const inp=row.querySelector("input"), btn=row.querySelector("button");
  const go=()=>{ const t=inp.value.trim(); if(t){ inp.value=""; send(q,c,t,false); } };
  btn.addEventListener("click",go);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } });
  g.appendChild(row);
  if(open) g.classList.add("show");
}

async function send(q,c,text,auto){
  const h=chats[q.id];
  h.push({role:"user",text});
  renderGem(q,c,true);
  const w=document.createElement("div"); w.className="gm wait"; w.textContent="Gemini is thinking…";
  c.querySelector(".gem > div").appendChild(w);
  try{
    const ans=await callGemini(h.filter(m=>!m.err));
    h.push({role:"model",text:ans});
  }catch(err){
    h.push({role:"model",text:"⚠ "+err.message,err:true});
  }
  const cc=$("c"+q.id); if(cc) renderGem(q,cc,true);
}

// ---- add question ----
const dlg=$("dlg"), fSet=$("fSet");
fSet.addEventListener("change",()=>{ $("fNewSet").style.display = fSet.value==="__new" ? "block":"none"; });
$("addBtn").addEventListener("click",()=>{
  $("addForm").reset(); $("fErr").textContent="";
  fSet.innerHTML = groups.map((g,i)=>'<option value="'+i+'">'+esc(g)+'</option>').join("") + '<option value="__new">+ New set…</option>';
  const v=sel.value; fSet.value = (v!=="all" && groups[+v]!==undefined) ? v : "__new";
  $("fNewSet").style.display = fSet.value==="__new" ? "block":"none";
  dlg.showModal(); $("fStmt").focus();
});
$("fCancel").addEventListener("click",()=>dlg.close());
$("addForm").addEventListener("submit",e=>{
  const stmt=$("fStmt").value.trim();
  let g = fSet.value==="__new" ? $("fNewSet").value.trim() : groups[+fSet.value];
  if(!stmt || !g){ e.preventDefault(); $("fErr").textContent = !g ? "Please enter a set name." : "Please enter a statement."; return; }
  const a = document.querySelector('input[name="fAns"]:checked').value==="1";
  const ex = $("fExp").value.trim() || ("The statement is "+(a?"True":"False")+".");
  // order: place after the last question in that set, or at the end for a new set
  const inSet = all.filter(q=>q.g===g);
  const maxAll = all.reduce((m,q)=>Math.max(m,q.o),0);
  const o = inSet.length ? Math.max(...inSet.map(q=>q.o)) + 0.001*(1) + Math.random()*0.0005 : (Math.floor(maxAll/1000)+1)*1000;
  selectGroupNext = "g:"+g;
  col.add({g,o,s:stmt,a,e:ex}).catch(err=>{ selectGroupNext=null; alert("Save failed: "+err.message+"\nCheck your Firestore rules."); });
  setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),400);
});
</script>
</body>
</html>
