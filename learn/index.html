<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Finance – True or False | B. Prasad Shah</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* ── Design tokens (mirror main site) ─────────────────────── */
:root {
  --navy:       #16213e;
  --navy-deep:  #0f1729;
  --orange:     #e8834e;
  --orange-dk:  #cf6a35;
  --cream:      #faf7f2;
  --ink:        #1c1c1c;
  --mist:       #7c879b;
  --line:       #e7e2d8;
  --white:      #ffffff;
  --card:       #ffffff;
  --card-alt:   #f5f0e8;
  --ok:         #12805c;
  --okbg:       #e5f6ef;
  --bad:        #c0392b;
  --badbg:      #fdeceb;
  --note-ink:   #7a4f00;
  --note-bg:    #fff4d6;
  --radius:     10px;
  --shadow:     0 4px 16px rgba(15,23,41,.08);
  --font-d:     "Fraunces", Georgia, serif;
  --font-b:     "Inter", system-ui, sans-serif;
}
[data-theme="dark"] {
  --navy:       #cbd5e1;
  --navy-deep:  #f1f5f9;
  --cream:      #0f172a;
  --ink:        #e2e8f0;
  --mist:       #94a3b8;
  --line:       #334155;
  --white:      #1e293b;
  --card:       #1e293b;
  --card-alt:   #162032;
  --ok:         #4ade80;
  --okbg:       #14532d;
  --bad:        #f87171;
  --badbg:      #450a0a;
  --note-ink:   #fde68a;
  --note-bg:    #3a2f12;
  --shadow:     0 4px 20px rgba(0,0,0,.45);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; overflow-x:hidden; }
body {
  font-family: var(--font-b);
  background: var(--cream);
  color: var(--ink);
  line-height: 1.55;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  animation: fadeIn .22s ease both;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
a { color:inherit; text-decoration:none; }
[hidden] { display:none !important; }

/* ── Site Header ────────────────────────────────────────────── */
.site-header {
  position: sticky; top:0; z-index:50;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  transition: background .2s;
}
[data-theme="dark"] .site-header { background: rgba(30,41,59,.95); }
.site-header .container {
  max-width: 1280px; margin:0 auto; padding:0 20px;
}
.header-inner {
  display:flex; align-items:center;
  justify-content:space-between;
  gap:16px; padding:10px 0;
}
.logo {
  font-family: var(--font-d);
  font-weight:700; font-size:1.25rem;
  color: var(--navy); white-space:nowrap;
  flex-shrink:0;
}
.logo span { color:var(--orange); }
[data-theme="dark"] .logo { color:#f1f5f9; }
.logo-badge {
  font-family: var(--font-b);
  font-size:.7rem; font-weight:700;
  background: rgba(232,131,78,.12);
  color:var(--orange);
  padding:2px 9px; border-radius:999px;
  border:1px solid rgba(232,131,78,.3);
}
.main-nav {
  display:flex; align-items:center;
  gap:4px; font-size:.88rem; font-weight:500;
  white-space:nowrap; flex-shrink:0;
}
.main-nav a {
  color:var(--ink); padding:6px 10px;
  border-radius:8px;
  transition:background .15s, color .15s;
}
.main-nav a:hover { color:var(--orange); background:rgba(232,131,78,.08); }
.header-actions {
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.theme-btn {
  width:34px; height:34px; border-radius:50%;
  border:1.5px solid var(--line);
  background:transparent; color:var(--ink);
  cursor:pointer; display:inline-flex;
  align-items:center; justify-content:center;
  transition:all .18s;
}
.theme-btn:hover {
  background:rgba(232,131,78,.12);
  border-color:var(--orange); color:var(--orange);
}
[data-theme="dark"] .theme-btn { color:#fbbf24; }

/* ── Control bar below header ────────────────────────────────── */
.ctrl-bar {
  background:var(--card);
  border-bottom:1px solid var(--line);
  padding:12px 20px;
}
.ctrl-inner {
  max-width:900px; margin:0 auto;
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
}
.ctrl-inner select,
.ctrl-inner input[type=text] {
  font:inherit; padding:7px 10px;
  border-radius:8px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink);
  font-size:.88rem;
}
.ctrl-inner select:focus,
.ctrl-inner input:focus {
  outline:none; border-color:var(--orange);
}
.tool-btn {
  font:inherit; font-size:.86rem; font-weight:600;
  padding:7px 14px; border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--card); color:var(--ink);
  cursor:pointer; display:inline-flex;
  align-items:center; gap:5px;
  transition:all .14s;
}
.tool-btn:hover { border-color:var(--mist); background:var(--card-alt); }
.tool-btn.primary {
  background:var(--orange); color:#fff;
  border-color:var(--orange);
}
.tool-btn.primary:hover { background:var(--orange-dk); border-color:var(--orange-dk); }
.tool-btn.navy {
  background:var(--navy); color:#fff;
  border-color:var(--navy);
}
.tool-btn.navy:hover { background:var(--navy-deep); border-color:var(--navy-deep); }

/* stats + progress */
.stats {
  margin-left:auto; font-size:.84rem; color:var(--mist);
  display:flex; align-items:center; gap:4px;
}
.stats b { color:var(--ink); }
.prog-track {
  height:4px; background:var(--line);
  border-radius:2px; overflow:hidden;
  margin-top:10px;
}
.prog-fill {
  height:100%; width:0;
  background:var(--orange);
  transition:width .3s ease;
  border-radius:2px;
}

/* admin-only gating */
body:not(.is-admin) .admin-only { display:none !important; }

/* ── Main Content ────────────────────────────────────────────── */
main { flex:1; padding:20px; }
.wrap { max-width:900px; margin:0 auto; }

.set-label {
  margin:24px 0 10px;
  font-size:.72rem; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase;
  color:var(--mist);
  display:flex; align-items:center; gap:8px;
}
.set-label::after {
  content:''; flex:1; height:1px;
  background:var(--line);
}

/* ── Question Card ───────────────────────────────────────────── */
.card {
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:var(--radius);
  padding:18px 20px;
  margin-bottom:14px;
  transition:box-shadow .2s, border-color .2s;
}
.card:hover { box-shadow:var(--shadow); }
.card.answered-right { border-color:rgba(18,128,92,.3); }
.card.answered-wrong { border-color:rgba(192,57,43,.3); }

.card-top {
  display:flex; align-items:flex-start;
  justify-content:space-between; gap:12px;
  margin-bottom:12px;
}
.q-label {
  font-size:.72rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.05em;
  color:var(--mist);
}
.q-tools {
  display:flex; gap:6px; flex-shrink:0;
}
.q-tools button {
  font:inherit; font-size:.78rem; font-weight:600;
  padding:3px 9px; border-radius:6px;
  border:1.5px solid var(--line);
  background:var(--card-alt); color:var(--mist);
  cursor:pointer; transition:all .14s;
  display:flex; align-items:center; gap:4px;
}
.q-tools .btn-ai:hover { border-color:var(--orange); color:var(--orange); }
.q-tools .btn-note:hover { border-color:#d97706; color:#d97706; }
.q-tools .btn-edit:hover { border-color:var(--navy); color:var(--navy); }
.q-tools .btn-del:hover  { border-color:var(--bad); color:var(--bad); }

.q-text {
  font-size:1rem; font-weight:600;
  line-height:1.45; margin-bottom:14px;
}

/* True / False buttons */
.opts { display:flex; gap:10px; }
.opt {
  flex:1; padding:11px;
  border-radius:10px;
  border:2px solid var(--line);
  background:transparent; color:var(--ink);
  font:inherit; font-size:.92rem; font-weight:600;
  cursor:pointer;
  transition:border-color .15s, background .15s, color .15s;
}
.opt:hover:not(:disabled) {
  border-color:var(--orange);
  background:rgba(232,131,78,.06);
}
.opt:disabled { cursor:default; }
.opt.picked.right {
  border-color:var(--ok);
  background:var(--okbg);
  color:var(--ok);
}
.opt.picked.wrong {
  border-color:var(--bad);
  background:var(--badbg);
  color:var(--bad);
}
.opt.show-answer { border-color:var(--ok); }

/* Explanation block */
.exp {
  display:none; margin-top:14px;
  padding:14px 16px; border-radius:10px;
  font-size:.93rem; line-height:1.6;
}
.exp.show { display:block; }
.exp.right { background:var(--okbg); }
.exp.wrong { background:var(--badbg); }
.verdict {
  font-weight:700; margin-bottom:6px; font-size:.95rem;
}
.exp.right .verdict { color:var(--ok); }
.exp.wrong .verdict { color:var(--bad); }

/* Stored note from question data */
.q-note {
  margin-top:10px; padding:10px 12px;
  border-radius:8px;
  background:var(--note-bg); color:var(--note-ink);
  font-size:.85rem; border-left:3px solid #d97706;
}

/* ── Per-question User Note ──────────────────────────────────── */
.note-panel {
  display:none; margin-top:12px;
  border-top:1px dashed var(--line);
  padding-top:12px;
}
.note-panel.show { display:block; }
.note-panel label {
  display:block; font-size:.75rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.05em;
  color:var(--mist); margin-bottom:6px;
}
.note-textarea {
  width:100%; font:inherit; font-size:.88rem;
  padding:9px 12px; border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--note-bg); color:var(--note-ink);
  resize:vertical; min-height:68px;
  transition:border-color .15s;
}
.note-textarea:focus {
  outline:none; border-color:#d97706;
}
.note-save-row {
  display:flex; justify-content:flex-end;
  margin-top:6px;
}
.note-save-row button {
  font:inherit; font-size:.8rem; font-weight:600;
  padding:4px 12px; border-radius:6px;
  border:1.5px solid #d97706;
  background:#d97706; color:#fff;
  cursor:pointer; transition:all .14s;
}
.note-save-row button:hover { background:#b45309; }
.user-note-display {
  margin-top:10px; padding:8px 12px;
  border-radius:8px;
  background:var(--note-bg); color:var(--note-ink);
  font-size:.84rem; border-left:3px solid #d97706;
  white-space:pre-wrap; word-break:break-word;
}
.user-note-display:empty { display:none; }

/* ── AI Panel ────────────────────────────────────────────────── */
.ai-panel {
  display:none; margin-top:12px;
  border-top:1px dashed var(--line);
  padding-top:12px;
}
.ai-panel.show { display:block; }
.ai-log {
  max-height:340px; overflow:auto;
  font-size:.92rem; margin-bottom:8px;
}
.ai-msg {
  padding:10px 13px; border-radius:10px;
  margin-bottom:8px; background:var(--card-alt);
  overflow-wrap:anywhere; line-height:1.6;
}
.ai-msg.me {
  background:rgba(232,131,78,.12);
  text-align:right;
  color:var(--ink);
}
.ai-msg p { margin:0 0 .5em; }
.ai-msg p:last-child { margin:0; }
.ai-msg ul,.ai-msg ol { margin:.2em 0 .5em; padding-left:1.4em; }
.ai-msg code {
  background:var(--line); padding:1px 5px;
  border-radius:4px; font-size:.88em;
}
.ai-msg pre {
  background:var(--navy-deep); color:#7dd3fc;
  padding:10px; border-radius:8px; overflow:auto;
  font-size:.85em;
}
.ai-msg h3,.ai-msg h4 { margin:.4em 0 .3em; }
.ai-ask {
  display:flex; gap:8px;
}
.ai-ask input {
  flex:1; min-width:0; font:inherit;
  font-size:.88rem; padding:7px 11px;
  border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--card); color:var(--ink);
  transition:border-color .15s;
}
.ai-ask input:focus { outline:none; border-color:var(--orange); }

/* ── Result Banner ───────────────────────────────────────────── */
.result {
  display:none; text-align:center;
  padding:28px 24px; margin:12px 0 48px;
  background:var(--card); border:1.5px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.result.show { display:block; }
.result .big {
  font-family:var(--font-d);
  font-size:2.4rem; font-weight:800;
  color:var(--orange); margin-bottom:8px;
}
.result p { color:var(--mist); font-size:1rem; }

/* ── Empty / Loading message ─────────────────────────────────── */
.msg { text-align:center; color:var(--mist); padding:48px 0; font-size:1rem; }

/* ── Leaderboard rows ────────────────────────────────────────── */
.lb-row {
  display:flex; gap:10px; align-items:center;
  padding:9px 12px; border-radius:8px; font-size:.9rem;
}
.lb-row:nth-child(odd) { background:var(--card-alt); }
.lb-row.me { outline:2px solid var(--orange); border-radius:8px; }
.lb-row .rk { width:2em; font-weight:700; color:var(--mist); }
.lb-row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lb-row .sc { font-variant-numeric:tabular-nums; font-weight:600; }

/* ── Dialog ──────────────────────────────────────────────────── */
dialog {
  border:1.5px solid var(--line);
  border-radius:14px;
  background:var(--card); color:var(--ink);
  width:min(540px,94vw); padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
dialog::backdrop { background:rgba(15,23,41,.5); }
dialog h2 {
  font-family:var(--font-d);
  font-size:1.1rem; margin-bottom:14px;
  color:var(--navy);
}
[data-theme="dark"] dialog h2 { color:var(--navy-deep); }
dialog label {
  display:block; font-size:.8rem; font-weight:600;
  color:var(--mist); margin:12px 0 4px;
  text-transform:uppercase; letter-spacing:.04em;
}
dialog textarea,
dialog input[type=text],
dialog select {
  width:100%; font:inherit; font-size:.9rem;
  padding:8px 10px; border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--cream); color:var(--ink);
  transition:border-color .15s;
}
dialog textarea { resize:vertical; }
dialog textarea:focus,
dialog input:focus,
dialog select:focus { outline:none; border-color:var(--orange); }
.radios { display:flex; gap:18px; margin-top:4px; }
.radios label {
  display:flex; align-items:center; gap:6px;
  margin:0; color:var(--ink);
  font-size:.95rem; text-transform:none; letter-spacing:0;
}
.dlg-btns {
  display:flex; gap:8px; justify-content:flex-end; margin-top:18px;
}
.err { color:var(--bad); font-size:.84rem; margin-top:8px; min-height:1em; }

/* ── Responsive ──────────────────────────────────────────────── */
@media (max-width:600px) {
  .main-nav { display:none; }
  .opts { flex-direction:column; }
  .ctrl-inner { gap:6px; }
  .stats { margin-left:0; width:100%; }
}
</style>
</head>

<!-- ══ Site Header ═══════════════════════════════════════════ -->
<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <a href="../index.html" class="logo" title="Homepage">
        B. <span>Prasad Shah</span>
        <span class="logo-badge">Learn</span>
      </a>
      <nav class="main-nav">

</header>

<!-- ══ Control Bar ════════════════════════════════════════════ -->
<div class="ctrl-bar">
  <div class="ctrl-inner">
    <select id="setSel" aria-label="Choose question set"><option>Loading…</option></select>
    <button class="tool-btn" id="shufBtn">🔀 Shuffle</button>
    <button class="tool-btn" id="resetBtn">↺ Reset</button>
    <button class="tool-btn navy" id="lbBtn">🏆 Leaderboard</button>

</div>

<!-- ══ Main ══════════════════════════════════════════════════ -->
<main>
  <div class="wrap" id="list"><div class="msg">Loading questions…</div></div>
  <div class="wrap">
    <div class="result" id="result">
      <div class="big" id="rScore"></div>
      <p id="rMsg"></p>
    </div>
  </div>
</main>

<!-- ══ Leaderboard Dialog ════════════════════════════════════ -->
<dialog id="lbDlg">
  <h2>🏆 Leaderboard</h2>
  <div id="lbList">Loading…</div>
  <div class="dlg-btns">
    <button type="button" class="tool-btn" onclick="document.getElementById('lbDlg').close()">Close</button>
  </div>
</dialog>

<!-- ══ Add / Edit Question Dialog ═══════════════════════════ -->
<dialog id="dlg">
  <form method="dialog" id="addForm">
    <h2 id="dTitle">Add a question</h2>
    <label for="fSet">Set</label>
    <select id="fSet"></select>
    <input type="text" id="fNewSet" placeholder="New set name" style="display:none;margin-top:6px">
    <label for="fStmt">Statement</label>
    <textarea id="fStmt" rows="3" placeholder="e.g. Higher discount rate results in lower present value."></textarea>
    <label>Correct answer</label>
    <div class="radios">
      <label><input type="radio" name="fAns" value="1" checked> True</label>
      <label><input type="radio" name="fAns" value="0"> False</label>
    </div>
    <label for="fExp">Explanation (shown after answering)</label>
    <textarea id="fExp" rows="3"></textarea>
    <label for="fNote">Note (optional – shown in amber)</label>
    <textarea id="fNote" rows="2"></textarea>
    <div class="err" id="fErr"></div>
    <div class="dlg-btns">
      <button type="button" class="tool-btn" id="fCancel">Cancel</button>
      <button type="submit" class="tool-btn primary" id="fSave">Save question</button>
    </div>
  </form>
</dialog>

<!-- ══ Confirm Delete Dialog ═════════════════════════════════ -->
<dialog id="delDlg">
  <h2>⚠️ Confirm Deletion</h2>
  <p style="margin: 10px 0 16px; font-size: 0.95rem; line-height: 1.5; color: var(--ink);">
    Are you sure you want to delete this question? This action will permanently remove it for everyone.
  </p>
  <div style="background: var(--card-alt); border-left: 3px solid var(--bad); padding: 10px 14px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 18px; color: var(--ink);" id="delQuestionPreview"></div>
  <div class="dlg-btns">
    <button type="button" class="tool-btn" id="delCancelBtn">Cancel</button>
    <button type="button" class="tool-btn" id="delConfirmBtn" style="background: var(--bad); color: #fff; border-color: var(--bad);">Yes, Delete</button>
  </div>
</dialog>

/* ── State helpers ────────────────────────────────────────── */
const $  = id => document.getElementById(id);
const PROG_KEY = "tuQuizProgressV2";
const NOTE_KEY = "tuQuizUserNotesV1";  // per-question personal notes

let state = {};     // {qid: boolean}
let notes = {};     // {qid: string}
try { state = JSON.parse(localStorage.getItem(PROG_KEY) || "{}") || {}; } catch(e) { state = {}; }
try { notes = JSON.parse(localStorage.getItem(NOTE_KEY) || "{}") || {}; } catch(e) { notes = {}; }
function saveState() { try { localStorage.setItem(PROG_KEY, JSON.stringify(state)); } catch(e) {} }
function saveNotes() { try { localStorage.setItem(NOTE_KEY, JSON.stringify(notes)); } catch(e) {} }

/* ── Question data ────────────────────────────────────────── */
const list = $("list"), sel = $("setSel");
let all = [], groups = [], visible = [], shuffled = false, selectGroupNext = null;
function handleQuestionsSnapshot(snap) {
  all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  // Sort in memory by 'o' if present
  all.sort((a, b) => (Number(a.o) || 0) - (Number(b.o) || 0));
  const seen = new Set(); groups = [];
  all.forEach(q => { if (q.g && !seen.has(q.g)) { seen.add(q.g); groups.push(q.g); } });
  const keep = selectGroupNext !== null ? selectGroupNext : sel.value;
  selectGroupNext = null;
  fillSel(keep); build(); scheduleSync();
}

function handleQuestionsError(err) {
  console.error("Firebase error loading questions:", err);
  list.innerHTML = `<div class="msg">
    <p style="color:var(--bad); font-weight:700; margin-bottom:8px;">⚠️ Could not load questions from Firebase</p>
    <p style="font-size:0.9rem; margin-bottom:12px; color:var(--ink);">${esc(err.message)}</p>
    <p style="font-size:0.85rem; color:var(--mist);">
      Please check that Firestore Database is created in project <b>${esc(firebaseConfig.projectId)}</b><br>
      and the Firestore Security Rules allow read access to the <b>questions</b> collection.
    </p>
  </div>`;
}

// Subscribe with graceful fallback if orderBy index is missing
try {
  col.orderBy("o").onSnapshot(handleQuestionsSnapshot, err => {
    console.warn("orderBy('o') failed, falling back to simple collection query:", err.message);
    col.onSnapshot(handleQuestionsSnapshot, handleQuestionsError);
  });
} catch(e) {
  col.onSnapshot(handleQuestionsSnapshot, handleQuestionsError);
}

function fillSel(keep) {
  const allAnswered = all.filter(q => q.id in state).length;
  let allStatusPrefix = "⚪";
  if (all.length > 0 && allAnswered === all.length) {
    allStatusPrefix = "✅";
  } else if (allAnswered > 0) {
    allStatusPrefix = "🟡";
  }

  const allOption = `<option value="all">${allStatusPrefix} All sets (${allAnswered}/${all.length})</option>`;

  const groupOptions = groups.map((g, i) => {
    const setQuestions = all.filter(q => q.g === g);
    const setTotal = setQuestions.length;
    const setAnswered = setQuestions.filter(q => q.id in state).length;

    let icon = "⚪"; // Not attempted
    let labelSuffix = `(0/${setTotal})`;

    if (setTotal > 0 && setAnswered === setTotal) {
      icon = "✅"; // Completed
      labelSuffix = `(${setTotal}/${setTotal} ✓)`;
    } else if (setAnswered > 0) {
      icon = "🟡"; // Partially attempted
      labelSuffix = `(${setAnswered}/${setTotal})`;
    }

    return `<option value="${i}">${icon} ${esc(g)} ${labelSuffix}</option>`;
  }).join("");

  sel.innerHTML = allOption + groupOptions;
  const k = typeof keep === "string" && keep.startsWith("g:") ? String(groups.indexOf(keep.slice(2))) : keep;
  sel.value = k !== undefined && [...sel.options].some(o => o.value === String(k)) ? String(k) : "all";
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

/* ── Build question cards ─────────────────────────────────── */
function build() {
  const v = sel.value;
  let items = all.filter(q => v === "all" || groups[+v] === q.g);
  if (shuffled) {
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
  }
  visible = items;
  list.innerHTML = "";
  if (!items.length) {
    list.innerHTML = '<div class="msg">No questions yet. Use "+ Add question".</div>';
    stats(); return;
  }
  let lastGroup = null, n = 0;
  items.forEach(q => {
    if (!shuffled && q.g !== lastGroup) {
      const h = document.createElement("div");
      h.className = "set-label";
      h.textContent = q.g;
      list.appendChild(h);
      lastGroup = q.g; n = 0;
    }
    n++;
    const card = buildCard(q, n);
    list.appendChild(card);
    if (q.id in state) paintCard(q);
    renderUserNote(q.id);
  });
  stats();
}

function buildCard(q, n) {
  const c = document.createElement("div");
  c.className = "card";
  c.id = "c" + q.id;

  c.innerHTML = `
    <div class="card-top">
      <span class="q-label">${shuffled ? esc(q.g) + " · " : ""}Q${n}</span>
      <div class="q-tools">
        <button class="btn-ai" title="AI Explanation">✨ Explain</button>
        <button class="btn-note" title="My Note">📝 Note</button>
        <button class="btn-edit admin-only" title="Edit">✏️ Edit</button>
        <button class="btn-del admin-only" title="Delete">🗑</button>
      </div>
    </div>
    <div class="q-text"></div>
    <div class="opts">
      <button class="opt" data-v="1">✓ True</button>
      <button class="opt" data-v="0">✗ False</button>
    </div>
    <div class="exp">
      <div class="verdict"></div>
      <div class="exp-body"></div>
    </div>
    <div class="note-panel">
      <label>📝 My personal note for this question</label>
      <textarea class="note-textarea" placeholder="Write your own notes, mnemonics, or reminders…"></textarea>
      <div class="note-save-row">
        <button type="button" class="btn-note-save">Save note</button>
      </div>
      <div class="user-note-display" id="nd${q.id}"></div>
    </div>
    <div class="ai-panel">
      <div class="ai-log"></div>
      <div class="ai-ask">
        <input type="text" placeholder="Ask a follow-up…">
        <button class="tool-btn primary btn-ai-send">Send</button>
      </div>
    </div>`;

  c.querySelector(".q-text").textContent = q.s;
  c.querySelector(".btn-del").addEventListener("click", () => promptDelete(q));
  c.querySelector(".btn-edit").addEventListener("click", () => openEditor(q));
  c.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(q, b.dataset.v === "1")));

  /* Note panel toggle */
  const notePanel = c.querySelector(".note-panel");
  const noteTextarea = c.querySelector(".note-textarea");
  const noteSaveBtn = c.querySelector(".btn-note-save");

  c.querySelector(".btn-note").addEventListener("click", () => {
    notePanel.classList.toggle("show");
    if (notePanel.classList.contains("show")) {
      noteTextarea.value = notes[q.id] || "";
      noteTextarea.focus();
    }
  });

  noteSaveBtn.addEventListener("click", () => {
    const val = noteTextarea.value.trim();
    if (val) notes[q.id] = val; else delete notes[q.id];
    saveNotes();
    renderUserNote(q.id);
    scheduleSync();
    notePanel.classList.remove("show");
  });

  setupAI(c, q);
  return c;
}

function renderUserNote(qid) {
  const el = $("nd" + qid);
  if (!el) return;
  el.textContent = notes[qid] || "";
}

/* ── Answer + Paint ───────────────────────────────────────── */
function answer(q, val) {
  if (q.id in state) return;
  state[q.id] = val; saveState(); paintCard(q); stats(); fillSel(sel.value); scheduleSync();
}

function paintCard(q) {
  const c = $("c" + q.id);
  if (!c) return;
  const chosen = state[q.id], correct = !!q.a, ok = chosen === correct;
  c.classList.add(ok ? "answered-right" : "answered-wrong");
  c.querySelectorAll(".opt").forEach(b => {
    const v = b.dataset.v === "1"; b.disabled = true;
    if (v === chosen) b.classList.add("picked", ok ? "right" : "wrong");
    if (v === correct && !ok) b.classList.add("show-answer");
  });
  const exp = c.querySelector(".exp");
  exp.classList.add("show", ok ? "right" : "wrong");
  exp.querySelector(".verdict").textContent =
    (ok ? "✓ Correct — " : "✗ Not quite — ") + "the statement is " + (correct ? "True" : "False");
  const body = exp.querySelector(".exp-body");
  body.innerHTML = q.e ? renderMD(q.e) : "";
  if (q.n) {
    const noteEl = document.createElement("div");
    noteEl.className = "q-note";
    noteEl.textContent = "📌 Note: " + q.n;
    body.appendChild(noteEl);
  }
}

/* ── Stats + Result ───────────────────────────────────────── */
function stats() {
  let ans = 0, ok = 0;
  visible.forEach(q => {
    if (q.id in state) { ans++; if (state[q.id] === !!q.a) ok++; }
  });
  $("sAns").textContent = ans; $("sTot").textContent = visible.length; $("sOk").textContent = ok;
  $("prog").style.width = visible.length ? (100 * ans / visible.length) + "%" : "0";
  const r = $("result");
  if (visible.length && ans === visible.length) {
    const p = Math.round(100 * ok / ans);
    $("rScore").textContent = ok + " / " + ans + " (" + p + "%)";
    $("rMsg").textContent = p >= 80 ? "🎉 Excellent work!" : p >= 60 ? "Good — review the ones you missed." : "Keep practising — read the explanations again.";
    r.classList.add("show");
  } else {
    r.classList.remove("show");
  }
}

/* ── Controls ─────────────────────────────────────────────── */
sel.addEventListener("change", () => { build(); window.scrollTo(0, 0); });
$("shufBtn").addEventListener("click", () => {
  shuffled = !shuffled;
  $("shufBtn").textContent = shuffled ? "🔀 Unshuffle" : "🔀 Shuffle";
  build();
});
$("resetBtn").addEventListener("click", () => {
  if (!confirm("Clear all your answers and start over?")) return;
  state = {}; saveState(); fillSel(sel.value); build(); scheduleSync(); window.scrollTo(0, 0);
});

/* ── Auth / Leaderboard / Sync ────────────────────────────── */
let user = null, syncTimer = null;
function isAdmin() { return !!user && !!user.email && user.emailVerified && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase(); }
function applyAuthUI() {
  document.body.classList.toggle("is-admin", isAdmin());
  $("authBtn").textContent = user
    ? "Sign out (" + String(user.displayName || user.email || "you").split(" ")[0] + ")"
    : "Sign in with Google";
}
$("authBtn").addEventListener("click", () => {
  if (user) { auth.signOut(); return; }
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
    if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
    alert("Sign-in failed: " + e.message +
      (e.code === "auth/unauthorized-domain"
        ? "\nAdd this domain in Firebase → Auth → Settings → Authorized domains." : ""));
  });
});
auth.onAuthStateChanged(async u => {
  const was = user; user = u; applyAuthUI();
  if (!u) {
    if (was) {
      state = {}; notes = {};
      saveState(); saveNotes();
      build();
    }
    return;
  }
  try {
    const s = await fsdb.collection("users").doc(u.uid).get();
    const data = s.exists ? s.data() : {};
    const remoteAnswers = data.answers || {};
    const remoteNotes = data.notes || {};
    state = { ...remoteAnswers, ...state };
    notes = { ...remoteNotes, ...notes };
    saveState(); saveNotes();
    build();
    scheduleSync();
  } catch(e) { console.warn("Could not load saved progress & notes:", e.message); }
});
function scheduleSync() {
  if (!user) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 700);
}
function syncNow() {
  if (!user || !all.length) return;
  let answered = 0, correct = 0;
  all.forEach(q => { if (q.id in state) { answered++; if (state[q.id] === !!q.a) correct++; } });
  fsdb.collection("users").doc(user.uid)
    .set({ answers: state, notes: notes, updated: Date.now() }, { merge: true })
    .catch(e => console.warn("Progress/notes not saved to Firebase:", e.message));
  fsdb.collection("leaderboard").doc(user.uid)
    .set({ name: String(user.displayName || "Student").slice(0, 60), answered, correct, t: Date.now() })
    .catch(e => console.warn("Leaderboard not updated:", e.message));
}
$("lbBtn").addEventListener("click", async () => {
  const box = $("lbList"); box.textContent = "Loading…"; $("lbDlg").showModal();
  if (!user) { box.textContent = "Sign in with Google to see the leaderboard."; return; }
  try {
    const s = await fsdb.collection("leaderboard").orderBy("correct", "desc").limit(20).get();
    if (s.empty) { box.textContent = "No scores yet — answer some questions!"; return; }
    box.innerHTML = ""; let i = 0;
    s.forEach(d => {
      const x = d.data(); i++;
      const row = document.createElement("div");
      row.className = "lb-row" + (d.id === user.uid ? " me" : "");
      const pct = x.answered ? Math.round(100 * x.correct / x.answered) : 0;
      row.innerHTML = '<span class="rk">' + i + '</span><span class="nm"></span><span class="sc">' + x.correct + " / " + x.answered + " (" + pct + "%)</span>";
      row.querySelector(".nm").textContent = x.name || "Student";
      box.appendChild(row);
    });
  } catch(e) { box.textContent = "Could not load leaderboard: " + e.message; }
});

/* ── Add / Edit dialog ────────────────────────────────────── */
const dlg = $("dlg"), fSet = $("fSet");
let editing = null;
fSet.addEventListener("change", () => {
  $("fNewSet").style.display = fSet.value === "__new" ? "block" : "none";
});
function fillSetOptions(selectedGroup) {
  fSet.innerHTML = groups.map((g, i) => '<option value="' + i + '">' + esc(g) + '</option>').join("") +
    '<option value="__new">+ New set…</option>';
  const idx = groups.indexOf(selectedGroup);
  fSet.value = idx >= 0 ? String(idx) : "__new";
  $("fNewSet").value = "";
  $("fNewSet").style.display = fSet.value === "__new" ? "block" : "none";
}
$("addBtn").addEventListener("click", () => {
  editing = null; $("addForm").reset(); $("fErr").textContent = "";
  $("dTitle").textContent = "Add a question"; $("fSave").textContent = "Save question";
  const v = sel.value; fillSetOptions(v !== "all" ? groups[+v] : null);
  dlg.showModal(); $("fStmt").focus();
});
function openEditor(q) {
  editing = q; $("addForm").reset(); $("fErr").textContent = "";
  $("dTitle").textContent = "Edit question"; $("fSave").textContent = "Save changes";
  fillSetOptions(q.g);
  $("fStmt").value = q.s || ""; $("fExp").value = q.e || ""; $("fNote").value = q.n || "";
  document.querySelector('input[name="fAns"][value="' + (q.a ? 1 : 0) + '"]').checked = true;
  dlg.showModal(); $("fStmt").focus();
}
$("fCancel").addEventListener("click", () => dlg.close());

/* ── Delete Confirmation Modal ────────────────────────────── */
const delDlg = $("delDlg");
let pendingDeleteQ = null;

function promptDelete(q) {
  pendingDeleteQ = q;
  $("delQuestionPreview").textContent = q.s;
  delDlg.showModal();
}

$("delCancelBtn").addEventListener("click", () => {
  pendingDeleteQ = null;
  delDlg.close();
});

$("delConfirmBtn").addEventListener("click", () => {
  if (!pendingDeleteQ) return;
  const qid = pendingDeleteQ.id;
  delete state[qid];
  saveState();
  if (notes[qid]) {
    delete notes[qid];
    saveNotes();
  }
  col.doc(qid).delete().catch(err => alert("Delete failed: " + err.message));
  pendingDeleteQ = null;
  delDlg.close();
});
function nextOrder(g) {
  const inSet = all.filter(q => q.g === g);
  const maxAll = all.reduce((m, q) => Math.max(m, q.o), 0);
  return inSet.length ? Math.max(...inSet.map(q => q.o)) + 0.001 + Math.random() * 0.0005 : (Math.floor(maxAll / 1000) + 1) * 1000;
}
$("addForm").addEventListener("submit", e => {
  const stmt = $("fStmt").value.trim();
  const g = fSet.value === "__new" ? $("fNewSet").value.trim() : groups[+fSet.value];
  if (!stmt || !g) {
    e.preventDefault();
    $("fErr").textContent = !g ? "Please enter a set name." : "Please enter a statement.";
    return;
  }
  const a = document.querySelector('input[name="fAns"]:checked').value === "1";
  const ex = $("fExp").value.trim() || ("The statement is " + (a ? "True" : "False") + ".");
  const note = $("fNote").value.trim();
  if (editing) {
    const q = editing;
    const upd = { g, s: stmt, a, e: ex, n: note || firebase.firestore.FieldValue.delete() };
    if (g !== q.g) { upd.o = nextOrder(g); selectGroupNext = "g:" + g; }
    col.doc(q.id).update(upd).catch(err => {
      selectGroupNext = null;
      alert("Save failed: " + err.message + "\nCheck your Firestore rules.");
    });
  } else {
    const doc = { g, o: nextOrder(g), s: stmt, a, e: ex }; if (note) doc.n = note;
    selectGroupNext = "g:" + g;
    col.add(doc).catch(err => { selectGroupNext = null; alert("Save failed: " + err.message); });
    setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 400);
  }
});

/* ── Markdown + Math rendering ────────────────────────────── */
const SYM = {"\\rightarrow":"→","\\to":"→","\\Rightarrow":"⇒","\\leftarrow":"←","\\times":"×","\\cdot":"·","\\div":"÷","\\leq":"≤","\\geq":"≥","\\neq":"≠","\\approx":"≈","\\%":"%","\\$":"$","\\sigma":"σ","\\beta":"β","\\alpha":"α"};
function mathHTML(tex, display) {
  try { if (window.katex) return katex.renderToString(tex, { throwOnError: false, displayMode: display }); } catch(e) {}
  let t = tex.replace(/\\(text|mathrm|mathbf)\{([^}]*)\}/g, "$2").replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "($1)/($2)");
  Object.keys(SYM).sort((a, b) => b.length - a.length).forEach(k => { t = t.split(k).join(SYM[k]); });
  return '<span>' + esc(t) + '</span>';
}
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_]+)__/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
}
function renderMD(src) {
  const maths = [];
  let s = String(src || "").replace(/\\\$/g, "\u0001").replace(/\$(?=\d)/g, "\u0001");
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => { maths.push(mathHTML(t.trim(), true)); return "\u0000" + (maths.length - 1) + "\u0000"; });
  s = s.replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => { maths.push(mathHTML(t.trim(), true)); return "\u0000" + (maths.length - 1) + "\u0000"; });
  s = s.replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => { maths.push(mathHTML(t.trim(), false)); return "\u0000" + (maths.length - 1) + "\u0000"; });
  s = s.replace(/\$([^$\n]+?)\$/g, (m, t) => { if (/^\s|\s$/.test(t) && !/\\/.test(t)) return m; maths.push(mathHTML(t.trim(), false)); return "\u0000" + (maths.length - 1) + "\u0000"; });
  s = esc(s);
  const lines = s.split("\n"), out = []; let listEl = null, para = [], code = null;
  const flushP = () => { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; } };
  const flushL = () => { if (listEl) { out.push("</" + listEl + ">"); listEl = null; } };
  lines.forEach(l => {
    if (/^```/.test(l)) { if (code === null) { flushP(); flushL(); code = []; } else { out.push("<pre><code>" + code.join("\n") + "</code></pre>"); code = null; } return; }
    if (code !== null) { code.push(l); return; }
    let m;
    if ((m = l.match(/^\s*#{1,6}\s+(.*)$/)))  { flushP(); flushL(); out.push("<h4>" + inline(m[1]) + "</h4>"); }
    else if ((m = l.match(/^\s*[*\-•]\s+(.*)$/)))  { flushP(); if (listEl !== "ul") { flushL(); out.push("<ul>"); listEl = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (listEl !== "ol") { flushL(); out.push("<ol>"); listEl = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if (!l.trim()) { flushP(); flushL(); }
    else { flushL(); para.push(l); }
  });
  if (code !== null) out.push("<pre><code>" + code.join("\n") + "</code></pre>");
  flushP(); flushL();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (m, i) => maths[+i]).replace(/\u0001/g, "$");
}

/* ── Gemini AI ────────────────────────────────────────────── */
// FIX: corrected model name (gemini-3.8-flash does not exist)
let GEMINI_MODEL = "gemini-1.5-flash";
const KEY_STORE = "geminiApiKey";
const GEMINI_API_KEY = "";   // optional: paste key here (Firestore config/gemini → key takes priority)
let fbKey = "";
const keyReady = fsdb.collection("config").doc("gemini").get()
  .then(s => {
    if (s.exists && s.data().key)   { fbKey = String(s.data().key).trim(); $("keyBtn").style.display = "none"; }
    if (s.exists && s.data().model) { GEMINI_MODEL = String(s.data().model).trim(); }
  })
  .catch(err => console.warn("Could not read config/gemini:", err.message));
const getKey = () => {
  if (fbKey) return fbKey;
  if (GEMINI_API_KEY) return GEMINI_API_KEY;
  try { return localStorage.getItem(KEY_STORE) || ""; } catch(e) { return ""; }
};
if (GEMINI_API_KEY) $("keyBtn").style.display = "none";
$("keyBtn").addEventListener("click", () => {
  const k = prompt("Paste your Gemini API key (stored only in this browser):", getKey());
  if (k === null) return;
  try { k.trim() ? localStorage.setItem(KEY_STORE, k.trim()) : localStorage.removeItem(KEY_STORE); } catch(e) {}
});

const chats = {};
async function askGemini(q, history) {
  await keyReady;
  const key = getKey();
  if (!key) throw new Error("Add your Gemini API key first (🔑 Gemini Key button).");
  const sys = "You are a friendly Business Finance tutor for Nepali TU students. The student is studying a True/False statement. Explain clearly and briefly in simple English, with a small example when useful. Use plain Markdown (bold, bullet lists). Write maths in $...$ LaTeX only when needed.";
  const ctx = "Statement: " + q.s + "\nCorrect answer: " + (q.a ? "True" : "False") + "\nBook explanation: " + (q.e || "") + (q.n ? "\nNote: " + q.n : "");
  const contents = [{ role: "user", parts: [{ text: ctx + "\n\nStudent request: " + history[0].text }] }];
  history.slice(1).forEach(m => contents.push({ role: m.role === "me" ? "user" : "model", parts: [{ text: m.text }] }));
  const r = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent?key=" + encodeURIComponent(key),
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents }) }
  );
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  const t = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts.map(p => p.text || "").join("");
  if (!t) throw new Error("Empty response from Gemini.");
  return t;
}

function setupAI(card, q) {
  const panel = card.querySelector(".ai-panel");
  const log = card.querySelector(".ai-log");
  const input = card.querySelector(".ai-ask input");
  const send = card.querySelector(".btn-ai-send");
  const hist = chats[q.id] = chats[q.id] || [];

  const draw = () => {
    log.innerHTML = "";
    hist.forEach(m => {
      const d = document.createElement("div");
      d.className = "ai-msg " + (m.role === "me" ? "me" : "ai");
      if (m.role === "me") d.textContent = m.text;
      else d.innerHTML = renderMD(m.text);
      log.appendChild(d);
    });
    log.scrollTop = log.scrollHeight;
  };

  const run = async text => {
    hist.push({ role: "me", text });
    draw();
    send.disabled = true;
    const wait = document.createElement("div");
    wait.className = "ai-msg";
    wait.textContent = "⏳ Thinking…";
    log.appendChild(wait);
    log.scrollTop = log.scrollHeight;
    try {
      const t = await askGemini(q, hist);
      hist.push({ role: "ai", text: t });
    } catch(err) {
      hist.pop();
      const d = document.createElement("div");
      d.className = "ai-msg";
      d.style.color = "var(--bad)";
      d.textContent = "❌ " + err.message;
      wait.replaceWith(d);
      send.disabled = false;
      return;
    }
    send.disabled = false;
    draw();
  };

  card.querySelector(".btn-ai").addEventListener("click", () => {
    panel.classList.toggle("show");
    if (panel.classList.contains("show")) {
      if (!hist.length) run("Explain this statement and why the answer is " + (q.a ? "True" : "False") + ".");
      else draw();
    }
  });

  const go = () => { const t = input.value.trim(); if (!t || send.disabled) return; input.value = ""; run(t); };
  send.addEventListener("click", go);
  input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

/* ── Theme toggle ─────────────────────────────────────────── */
const MOON = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
const SUN  = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").innerHTML = t === "dark" ? SUN : MOON;
  try { localStorage.setItem("theme", t); } catch(e) {}
}
(function () {
  let saved = "light";
  try { saved = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"); } catch(e) {}
  applyTheme(saved);
})();
$("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(cur === "dark" ? "light" : "dark");
});
</script>
