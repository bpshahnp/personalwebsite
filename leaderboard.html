<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard | B. Prasad Shah</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">B. <span>Prasad Shah</span></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="mcq.html">MCQ Hub</a>
        <a href="python.html">Python Hub</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
      </nav>
      <div class="header-actions">
        <div class="auth-widget">
          <button class="auth-icon-btn" id="authIconBtn" aria-label="Account">👤</button>
          <div class="auth-dropdown" id="authDropdown" hidden></div>
        </div>
      </div>
      <div class="mobile-header-icons">
        <button class="nav-toggle" id="navToggle" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <div class="nav-drawer" id="navDrawer">
    <button class="drawer-close" id="drawerClose" aria-label="Close menu">&times;</button>
    <nav class="drawer-nav">
      <a href="index.html">Home</a>
      <a href="mcq.html">MCQ Hub</a>
      <a href="python.html">Python Hub</a>
      <a href="leaderboard.html" class="active">Leaderboard</a>
    </nav>
    <div class="drawer-account">
      <div class="auth-widget">
        <button class="auth-icon-btn" id="authIconBtnMobile" aria-label="Account">👤</button>
        <div class="auth-dropdown" id="authDropdownMobile" hidden></div>
      </div>
    </div>
  </div>
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <section class="page-hero">
    <div class="container">
      <h1>Leaderboard</h1>
      <p>Top scorers from the MCQ Hub quiz, ranked by best score. Log in before taking a quiz to appear here.</p>
    </div>
  </section>

  <section class="leaderboard-section">
    <div class="container" style="max-width:680px">
      <div class="leaderboard-table" id="leaderboardTable">
        <div class="leaderboard-row header-row">
          <span>#</span><span>Player</span><span style="text-align:right">Best score</span>
        </div>
        <p class="updates-loading" style="padding:20px">Loading leaderboard…</p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> B. Prasad Shah — Python Hub</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-widget.js"></script>
  <script src="js/nav-drawer.js"></script>
  <script src="js/leaderboard.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
