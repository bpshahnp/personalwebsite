<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition Round</title><link rel="stylesheet" href="style.css"></head><body><div class="app-shell round-shell"><header class="header compact"><a class="home-btn" href="admin.html">←</a><a class="scoreboard-btn" href="scoreboard.html">🏆 Scoreboard</a><div class="header-top"><div class="left-section"><div class="school-logo"><img src="assets/school_logo.png" alt="Om Shanti Academy"></div><div><h1>OM SHANTI ACADEMY</h1><div class="school-tagline">"An activity based school"</div></div></div></div><div class="competition-title">INTER-HOUSE SPELLING BEE COMPETITION - 2083</div></header><main class="round-content"><div class="round-topbar"><div><span class="eyebrow">LIVE ROUND</span><h2 id="roundTitle">Round</h2></div><div class="turn-controls"><label>Team<select id="teamSelect"></select></label><button class="secondary-btn" id="addTeam">＋ Team</button></div></div><div class="question-nav"><button id="qPrev" class="secondary-btn">←</button><div id="questionTabs" class="question-tabs"></div><button id="qNext" class="secondary-btn">→</button></div><section class="word-workspace"><div id="challenge"><div class="challenge-header"><div><span class="question-label" id="questionLabel">Question</span><h3>Spell out the word</h3></div><span id="statusPill" class="status-pill">Not attempted</span></div><div class="word-card"><div class="word-icon">🔤</div><div class="word-prompt" id="wordPrompt">Listen carefully</div><div class="word-hint" id="wordHint">Use the prompt or pronunciation provided by the moderator.</div></div><div class="spell-form"><label for="spellInput">Enter the spelling</label><div class="input-row"><input id="spellInput" autocomplete="off" spellcheck="false" placeholder="Type the spelling here"><button id="checkBtn" class="check-btn">✓ Check</button></div><div id="feedback" class="feedback"></div></div><div class="action-row"><button id="passBtn" class="pass-btn">↪ Pass</button><button id="endBtn" class="end-btn">⏹ End Turn</button><button id="revealBtn" class="reveal-btn">🔓 Reveal Answer</button></div><div id="answerPanel" class="answer-panel" hidden><span>Official Answer</span><strong id="answerText"></strong></div><div class="next-row"><button id="prevQuestion" class="secondary-btn">← Previous</button><button id="nextQuestion" class="primary-btn">Next Question →</button></div></div></section></main></div><script type="module" src="round.js"></script></body></html>
