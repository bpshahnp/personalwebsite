<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    ================================================================
    quiz-share.html — Quiz Deep-Link Landing Page
    ================================================================
    PURPOSE:
      This page is the canonical share target for quiz cards. When a
      user shares a quiz link, it points here:
        https://bholaprasadshah.com.np/quiz-share.html?id=<quiz_id>

    FOR SOCIAL MEDIA CRAWLERS (Facebook, Twitter, WhatsApp, etc.):
      A Cloudflare Worker intercepts requests to this URL, fetches
      the quiz data from Firestore REST API, and injects the correct
      OG meta tags (image, title, description) before responding.
      Crawlers see the quiz image; regular users get the JS redirect.

    FOR REGULAR USERS (browsers with JS):
      JavaScript reads the ?id= param, fetches the quiz from Firestore,
      populates the preview card, then automatically redirects to
        https://bholaprasadshah.com.np/premium.html?quiz=<id>
      so the quiz auto-starts.

    Default OG tags below are PLACEHOLDERS — the Cloudflare Worker
    replaces them for social crawlers before they are ever read.
    ================================================================
  -->

  <!-- Default OG tags (replaced by Cloudflare Worker for crawlers) -->
  <title id="pageTitle">Premium Quiz | B. Prasad Shah</title>
  <meta name="description" id="pageDesc" content="Challenge yourself with this premium quiz on B. Prasad Shah's Portal!" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="B. Prasad Shah" />
  <meta property="og:url" id="ogUrl" content="https://bholaprasadshah.com.np/quiz-share.html" />
  <meta property="og:title" id="ogTitle" content="Premium Quiz | B. Prasad Shah" />
  <meta property="og:description" id="ogDesc" content="Challenge yourself with this premium quiz. Sign up for free and get 2 credits to start!" />
  <meta property="og:image" id="ogImage" content="https://bholaprasadshah.com.np/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twTitle" content="Premium Quiz | B. Prasad Shah" />
  <meta name="twitter:description" id="twDesc" content="Challenge yourself with this premium quiz. Sign up for free and get 2 credits to start!" />
  <meta name="twitter:image" id="twImage" content="https://bholaprasadshah.com.np/assets/og-image.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #090e18;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      color: #f1f5f9;
    }
    .share-card {
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 20px;
      max-width: 460px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      animation: fadeUp 0.35s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .share-card-img {
      height: 200px;
      background: linear-gradient(135deg, #1e293b 0%, #3b82f6 100%);
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .share-card-img::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(9,14,24,0.15) 0%, rgba(9,14,24,0.8) 100%);
    }
    .share-card-img-placeholder {
      font-size: 3rem;
      z-index: 1;
    }
    .share-card-body {
      padding: 24px 24px 28px;
    }
    .share-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #d97706;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 9999px;
      padding: 3px 10px;
      margin-bottom: 10px;
    }
    .share-card-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .share-card-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 20px;
    }
    .share-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 22px;
    }
    .share-card-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .play-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #e8834e 0%, #d97706 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    .play-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .play-btn:active {
      transform: translateY(0);
    }
    .redirect-note {
      text-align: center;
      font-size: 0.78rem;
      color: #475569;
      margin-top: 14px;
    }
    .dot-loader {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .dot-loader span {
      width: 5px;
      height: 5px;
      background: #64748b;
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }
    .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
    .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }
    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px 0;
      font-size: 0.78rem;
      color: #475569;
    }
    .brand-bar a {
      color: #60a5fa;
      text-decoration: none;
    }
    .error-state {
      text-align: center;
      padding: 48px 24px;
    }
    .error-state h2 { color: #f87171; margin: 0 0 8px; }
    .error-state p  { color: #94a3b8; margin: 0 0 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="share-card" id="shareCard">
  <!-- Loading state -->
  <div class="share-card-img" id="cardImg">
    <div class="share-card-img-placeholder">📚</div>
  </div>
  <div class="brand-bar">
    <span>B. Prasad Shah's Quiz Portal</span>
    <a href="https://bholaprasadshah.com.np/premium.html">All Quizzes →</a>
  </div>
  <div class="share-card-body">
    <div class="share-badge" id="cardBadge">Premium Quiz</div>
    <h1 class="share-card-title" id="cardTitle">
      <span class="dot-loader"><span></span><span></span><span></span></span>
    </h1>
    <p class="share-card-desc" id="cardDesc">Loading quiz details…</p>
    <div class="share-card-meta" id="cardMeta"></div>
    <a class="play-btn" id="playBtn" href="premium.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      Play This Quiz
    </a>
    <p class="redirect-note" id="redirectNote">Loading…</p>
  </div>
</div>

<script>
  /* ================================================================
     quiz-share.html — Client-Side Logic
     Reads ?id= from URL, fetches quiz from Firestore REST API,
     populates the card, and redirects to premium.html?quiz=<id>
  ================================================================ */

  const FIRESTORE_PROJECT = "personalwebsite-9b430";
  const SITE_ORIGIN       = "https://bholaprasadshah.com.np";
  const DEFAULT_OG_IMAGE  = SITE_ORIGIN + "/assets/og-image.png";

  const cardImg      = document.getElementById("cardImg");
  const cardTitle    = document.getElementById("cardTitle");
  const cardDesc     = document.getElementById("cardDesc");
  const cardMeta     = document.getElementById("cardMeta");
  const cardBadge    = document.getElementById("cardBadge");
  const playBtn      = document.getElementById("playBtn");
  const redirectNote = document.getElementById("redirectNote");

  function escH(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function getQuizCategoryLabel(data) {
    const cat = (data.category || data.level || "").toString().toLowerCase();
    if (cat.includes("lok") || cat.includes("loksewa") || cat.includes("civil")) return "Lok Sewa";
    if (cat.includes("bank")) return "Banking";
    if (cat.includes("class 11") || cat.includes("11")) return "Class 11";
    if (cat.includes("class 12") || cat.includes("12")) return "Class 12";
    if (cat.includes("neb")) return "NEB";
    if (cat.includes("general") || cat.includes("gk")) return "General Knowledge";
    if (cat.includes("it") || cat.includes("computer") || cat.includes("tech")) return "IT / Technology";
    return data.category || "Premium";
  }

  async function loadQuizAndRedirect() {
    const params   = new URLSearchParams(window.location.search);
    const quizId   = params.get("id") || params.get("quiz");

    if (!quizId) {
      // No quiz ID — show fallback
      cardTitle.textContent = "Quiz Not Found";
      cardDesc.textContent  = "No quiz was specified. Please use a full quiz share link.";
      redirectNote.textContent = "";
      playBtn.href = "premium.html";
      playBtn.textContent = "Browse All Quizzes";
      return;
    }

    // Build premium.html target URL
    const targetUrl = `${location.origin || SITE_ORIGIN}/premium.html?quiz=${encodeURIComponent(quizId)}`;
    playBtn.href = targetUrl;

    try {
      // Fetch from Firestore REST API (no auth required for public collection)
      const firestoreUrl =
        `https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents/premiumQuizContent/${encodeURIComponent(quizId)}`;
      const res  = await fetch(firestoreUrl);
      const json = await res.json();

      if (!res.ok || json.error || !json.fields) {
        throw new Error("Quiz not found");
      }

      const f = json.fields;

      const name        = f.name        ? f.name.stringValue        : "Premium Quiz";
      const description = f.description ? f.description.stringValue : "A comprehensive timed competitive examination quiz.";
      const imageUrl    = f.imageUrl    ? f.imageUrl.stringValue     : null;
      const credits     = f.credits     ? Number(f.credits.integerValue || f.credits.doubleValue || 3) : 3;
      const qCount      = f.questionCount ? Number(f.questionCount.integerValue || 0) : 0;
      const catLabel    = getQuizCategoryLabel({
        category: f.category ? f.category.stringValue : ""
      });

      // Populate card
      cardTitle.textContent = name;
      cardDesc.textContent  = description;
      cardBadge.textContent = catLabel;

      cardMeta.innerHTML = `
        <span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Timed Quiz
        </span>
        ${qCount > 0 ? `<span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          ${qCount} Questions
        </span>` : ""}
        <span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M15 9.5a3.5 3.5 0 0 0-7 0c0 2 1.5 3 3.5 3.5s3.5 1.5 3.5 3.5a3.5 3.5 0 0 1-7 0"/></svg>
          ${credits} Credit${credits === 1 ? "" : "s"}
        </span>
      `;

      // Set background image on card
      if (imageUrl) {
        cardImg.style.backgroundImage = `url('${escH(imageUrl)}')`;
        cardImg.style.backgroundSize  = "cover";
        cardImg.style.backgroundPosition = "center";
        cardImg.querySelector(".share-card-img-placeholder")?.remove();
      }

      // Auto-redirect after 2 seconds
      let secondsLeft = 2;
      redirectNote.textContent = `Redirecting to quiz in ${secondsLeft}s…`;
      const interval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <= 0) {
          clearInterval(interval);
          redirectNote.textContent = "Launching quiz…";
          window.location.replace(targetUrl);
        } else {
          redirectNote.textContent = `Redirecting to quiz in ${secondsLeft}s…`;
        }
      }, 1000);

      // Play button skips countdown
      playBtn.addEventListener("click", (e) => {
        e.preventDefault();
        clearInterval(interval);
        window.location.href = targetUrl;
      });

    } catch (err) {
      console.error("Failed to load quiz:", err);
      cardTitle.textContent = "Quiz Not Found";
      cardDesc.textContent  = "This quiz may have been removed or the link is invalid. Browse all available quizzes below.";
      cardMeta.innerHTML    = "";
      redirectNote.textContent = "";
      playBtn.textContent = "Browse All Quizzes";
      playBtn.href = "premium.html";
    }
  }

  loadQuizAndRedirect();
</script>
</body>
</html>
