<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCQ Hub | B. Prasad Shah</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">B. <span>Prasad Shah</span></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="mcq.html" class="active">MCQ Hub</a>
        <a href="index.html#python-hub">Python Hub</a>
      </nav>
      <div class="header-actions">
        <input type="search" id="categoryFilter" placeholder="Filter by category…" class="filter-input" />
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1>MCQ Hub</h1>
      <p>Practice questions below. Pick an option to see if you're right, with an explanation for each.</p>
    </div>
  </section>

  <section class="mcq-section">
    <div class="container">
      <div id="mcqList" class="mcq-list">
        <p class="updates-loading">Loading questions…</p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> B. Prasad Shah — Python Hub</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/mcq.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("navToggle").addEventListener("click", () => document.querySelector(".site-header").classList.toggle("open"));</script>
</body>
</html>
